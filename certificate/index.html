<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>東海國小 - 核銷憑證多專案管理系統</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Microsoft JhengHei", sans-serif;
      background-color: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      width: 100%;
      max-width: 500px;
      padding: 35px 25px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      text-align: center;
    }
    h2 { color: #1a1a1a; margin-bottom: 6px; font-size: 24px; }
    p.subtitle { color: #666; font-size: 14px; margin-bottom: 20px; }

    .login-box { margin: 15px 0; display: flex; justify-content: center; }

    /* 狀態提示 */
    .status-box {
      margin-top: 15px;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.5;
      display: none;
      text-align: left;
    }
    .status-error { background-color: #fde8e8; color: #9b1c1c; border-left: 4px solid #f98080; }
    .status-warning { background-color: #fef08a; color: #713f12; border-left: 4px solid #eab308; }
    .status-success { background-color: #def7ec; color: #03543f; border-left: 4px solid #31c48d; }
    .status-info { background-color: #e1effe; color: #1e429f; border-left: 4px solid #76a9fa; }

    /* 專案卡片清單 */
    .voucher-list { margin-top: 20px; text-align: left; display: none; }
    .voucher-item {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 14px 16px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.2s;
    }
    .voucher-item:hover { border-color: #1a73e8; background: #f0f7ff; }
    .voucher-title { font-weight: 600; color: #1f2937; font-size: 15px; }

    /* 申請卡片 */
    .apply-card {
      display: none;
      margin-top: 20px;
      padding: 20px;
      background-color: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      text-align: left;
    }
    .apply-card h3 { font-size: 16px; margin-bottom: 12px; color: #374151; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 13px; color: #4b5563; margin-bottom: 4px; font-weight: 500; }
    .form-control {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 14px;
      background-color: #fff;
    }
    .form-control:read-only { background-color: #e5e7eb; cursor: not-allowed; }

    /* 按鈕樣式 */
    .btn {
      padding: 8px 14px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      text-align: center;
    }
    .btn-primary { background-color: #1a73e8; color: #fff; }
    .btn-primary:hover { background-color: #1557b0; }
    .btn-outline { background: transparent; border: 1px dashed #1a73e8; color: #1a73e8; width: 100%; padding: 12px; margin-top: 10px; }
    .btn-outline:hover { background: #f0f7ff; }
    .btn-success { background-color: #0e9f6e; color: #fff; width: 100%; padding: 11px; margin-top: 12px; }
    .btn-success:hover { background-color: #046c4e; }
  </style>
</head>
<body>

  <div class="card">
    <h2>東海國小核銷憑證系統</h2>
    <p class="subtitle">登入或申請您的專案核銷試算表</p>

    <!-- Google 登入按鈕 -->
    <div class="login-box">
      <div id="g_id_onload"
           data-client_id="341910377782-3unva3oggi84vp88uga23horpumjaptt.apps.googleusercontent.com"
           data-callback="handleCredentialResponse"
           data-auto_prompt="false">
      </div>
      <div class="g_id_signin" data-type="standard" data-size="large" data-theme="outline" data-text="sign_in_with" data-shape="pill"></div>
    </div>

    <!-- 狀態通知訊息 -->
    <div id="statusBox" class="status-box"></div>

    <!-- 專案試算表列表區 (登入成功後展示) -->
    <div id="voucherListArea" class="voucher-list">
      <p style="font-size: 14px; font-weight: bold; margin-bottom: 10px; color: #374151;">📄 您名下的專案試算表：</p>
      <div id="voucherItems"></div>
      <!-- 申請第二份/新專案按鈕 -->
      <button type="button" class="btn btn-outline" onclick="toggleNewProjectForm()">➕ 申請建立新專案試算表</button>
    </div>

    <!-- 申請專案表單區 (首次使用或點選新增時展開) -->
    <div id="applyCard" class="apply-card">
      <h3 id="applyCardTitle">📋 申請開通專案憑證試算表</h3>
      <div class="form-group">
        <label>申請人姓名：</label>
        <input type="text" id="applyName" class="form-control" placeholder="請確認真實姓名">
      </div>
      <div class="form-group">
        <label>學校帳號 (Email)：</label>
        <input type="text" id="applyEmail" class="form-control" readonly>
      </div>
      <div class="form-group">
        <label>專案名稱 / 表單用途：</label>
        <input type="text" id="applyProject" class="form-control" placeholder="例如：115沙城盃、體育組訓、115常規經費">
      </div>
      <button type="button" id="btnSubmitApply" class="btn btn-success" onclick="submitApplication()">🚀 送出專案開通申請</button>
    </div>
  </div>

  <script>
    // ⚠️ 請填入您的中央帳號 GAS 部署 Web App URL (結尾為 /exec)
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwF47CoHbuGAFnOWkoqrifLfppHUUrbyp4kVcD5eeaUAdqgzSLS5SD5oHdO7OaNZ_VILg/exec";

    let currentLoggedInUser = null;

    // 處理 Google 登入回調
    function handleCredentialResponse(response) {
      showStatus("正在核對專案清單，請稍候...", "status-info");
      hideElement("applyCard");
      hideElement("voucherListArea");

      fetch(GAS_API_URL, {
        method: "POST",
        body: JSON.stringify({
          action: "oauth_login",
          id_token: response.credential
        })
      })
      .then(res => res.json())
      .then(data => {
        if (data.result === "success") {
          currentLoggedInUser = data.user;
          showStatus("✅ <b>登入成功！</b> 歡迎 " + data.user.name + " 同仁", "status-success");
          
          // 渲染名下所有已核准專案試算表
          renderVoucherList(data.user.vouchers, data.user.pendingCount);
          showElement("voucherListArea");

        } else if (data.result === "not_registered") {
          showStatus("⚠️ <b>您尚未開通憑證系統</b><br>請填寫下方專案名稱並送出申請：", "status-warning");
          document.getElementById("applyEmail").value = data.email || "";
          document.getElementById("applyName").value = data.name || "";
          document.getElementById("applyProject").value = "115年度經費"; // 預設值
          showElement("applyCard");

        } else if (data.result === "pending") {
          showStatus("⏳ <b>專案審核中！</b><br>" + data.message, "status-warning");

        } else {
          showStatus("❌ " + data.message, "status-error");
        }
      })
      .catch(err => {
        showStatus("連線伺服器失敗，請稍後再試！", "status-error");
        console.error(err);
      });
    }

    // 渲染專案列表卡片
    function renderVoucherList(vouchers, pendingCount) {
      const container = document.getElementById("voucherItems");
      container.innerHTML = "";

      vouchers.forEach((v, index) => {
        const item = document.createElement("div");
        item.className = "voucher-item";
        item.innerHTML = `
          <div>
            <div class="voucher-title">📌 ${v.projectName}</div>
          </div>
          <a href="${v.spreadsheetUrl}" target="_blank" class="btn btn-primary">進入試算表 ➔</a>
        `;
        container.appendChild(item);
      });

      if (pendingCount > 0) {
        const pendingNote = document.createElement("p");
        pendingNote.style.cssText = "font-size: 13px; color: #b45309; margin: 8px 0;";
        pendingNote.innerHTML = `⏳ 提醒：您目前尚有 <b>${pendingCount}</b> 個專案申請正在管理員審核中。`;
        container.appendChild(pendingNote);
      }
    }

    // 切換顯示「申請新專案」表單
    function toggleNewProjectForm() {
      if (!currentLoggedInUser) return;
      document.getElementById("applyName").value = currentLoggedInUser.name;
      document.getElementById("applyEmail").value = currentLoggedInUser.email;
      document.getElementById("applyProject").value = "";
      document.getElementById("applyCardTitle").innerText = "➕ 申請建立第二份/新專案試算表";
      showElement("applyCard");
      document.getElementById("applyProject").focus();
    }

    // 送出專案申請
    function submitApplication() {
      const name = document.getElementById("applyName").value.trim();
      const email = document.getElementById("applyEmail").value.trim();
      const project = document.getElementById("applyProject").value.trim() || "個人專用憑證系統";
      const btn = document.getElementById("btnSubmitApply");

      if (!name) {
        alert("請確認姓名！");
        return;
      }

      btn.disabled = true;
      btn.innerText = "傳送申請中...";

      fetch(GAS_API_URL, {
        method: "POST",
        body: JSON.stringify({
          action: "apply",
          name: name,
          email: email,
          projectName: project
        })
      })
      .then(res => res.json())
      .then(data => {
        if (data.result === "success") {
          hideElement("applyCard");
          showStatus("🎉 <b>專案【" + project + "】申請已送出！</b><br>管理員核准後將自動為您生成專屬試算表並發信通知。", "status-success");
        } else {
          showStatus("❌ 申請失敗：" + data.message, "status-error");
        }
        btn.disabled = false;
        btn.innerText = "🚀 送出專案開通申請";
      })
      .catch(err => {
        alert("發送失敗，請稍後重試！");
        btn.disabled = false;
        btn.innerText = "🚀 送出專案開通申請";
      });
    }

    function showStatus(html, typeClass) {
      const box = document.getElementById("statusBox");
      box.className = "status-box " + typeClass;
      box.innerHTML = html;
      box.style.display = "block";
    }

    function showElement(id) { document.getElementById(id).style.display = "block"; }
    function hideElement(id) { document.getElementById(id).style.display = "none"; }
  </script>
</body>
</html>
