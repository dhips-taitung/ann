<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>動態檢核表單系統</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background-color: #f4f6f9;
      margin: 0;
      padding: 15px 10px;
      color: #333;
    }
    .container {
      max-width: 820px;
      margin: 0 auto;
      background: #ffffff;
      padding: 25px 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1a73e8;
      color: white;
      padding: 10px 18px;
      border-radius: 8px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .top-bar-title {
      font-size: 16px;
      font-weight: bold;
    }
    .admin-btn {
      background: #fbbc04;
      color: #202124;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    .admin-btn:hover { background: #f29900; }

    .query-card {
      background-color: #eef3fc;
      border: 1px solid #c2d7fa;
      border-radius: 8px;
      padding: 12px 18px;
      margin-bottom: 20px;
    }
    .query-input-group {
      display: flex;
      gap: 10px;
      margin-top: 6px;
    }
    .query-input-group input {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .query-btn {
      padding: 8px 16px;
      background-color: #1a73e8;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    h2 { text-align: center; color: #1a73e8; margin-top: 0; }
    .header-desc {
      font-size: 14px;
      color: #5f6368;
      line-height: 1.6;
      background-color: #f8f9fa;
      border: 1px solid #e8eaed;
      padding: 12px 15px;
      border-radius: 6px;
      margin-bottom: 15px;
      white-space: pre-wrap;
    }

    .ref-link-box {
      background: #f0f7ff;
      border: 1px solid #c2d7fa;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13.5px;
      margin-bottom: 15px;
      word-break: break-all;
    }
    .ref-link-box a { color: #1a73e8; font-weight: bold; text-decoration: underline; }

    .header-img-display {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      margin-bottom: 15px;
      display: block;
    }

    .section-card {
      background: #fafafa;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 18px 20px;
      margin-bottom: 20px;
    }
    .checkbox-item {
      display: flex;
      align-items: flex-start;
      margin-bottom: 10px;
      font-size: 15px;
      line-height: 1.5;
      cursor: pointer;
    }
    .checkbox-item input[type="checkbox"] {
      width: 20px;
      height: 20px;
      margin-right: 12px;
      margin-top: 2px;
      flex-shrink: 0;
    }
    .item-desc-box {
      background-color: #f0f7ff;
      border-left: 4px solid #1a73e8;
      padding: 8px 12px;
      font-size: 13px;
      color: #333;
      margin-top: 4px;
      margin-bottom: 10px;
      margin-left: 32px;
      border-radius: 0 4px 4px 0;
      line-height: 1.5;
      white-space: pre-wrap;
    }
    .item-img-display {
      max-width: 280px;
      max-height: 200px;
      border-radius: 6px;
      margin-top: 6px;
      margin-bottom: 10px;
      margin-left: 32px;
      display: block;
      border: 1px solid #ddd;
    }

    .input-group { margin-bottom: 15px; }
    .input-group label { display: block; font-weight: bold; margin-bottom: 5px; }
    .input-group input, .input-group select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }

    .class-info-group {
      display: flex;
      gap: 12px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }
    .class-info-item {
      flex: 1;
      min-width: 100px;
    }
    .class-info-item label { display: block; font-weight: bold; margin-bottom: 5px; }
    .class-info-item select, .class-info-item input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }

    .signature-container {
      border: 2px dashed #1a73e8;
      border-radius: 8px;
      background-color: #ffffff;
      margin-top: 8px;
    }
    canvas#signatureCanvas {
      width: 100%;
      height: 216px;
      display: block;
      cursor: crosshair;
    }
    .clear-btn {
      float: right;
      margin-top: 6px;
      background: #e0e0e0;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      background-color: #34a853;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
    }
    .submit-btn:hover { background-color: #2d8e47; }
    .submit-btn:disabled { background-color: #cccccc; cursor: not-allowed; }

    .modal-overlay {
      display: none;
      position: fixed;
      top:0; left:0; right:0; bottom:0;
      background: rgba(0,0,0,0.6);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 10px;
    }
    .modal-card {
      background: white;
      border-radius: 10px;
      padding: 25px;
      width: 100%;
      max-width: 820px;
      max-height: 90vh;
      overflow-y: auto;
    }

    /* 後台頁籤 Tab 樣式 */
    .tab-bar {
      display: flex;
      gap: 5px;
      border-bottom: 2px solid #1a73e8;
      margin-bottom: 15px;
    }
    .tab-btn {
      padding: 10px 16px;
      border: none;
      background: #eef3fc;
      color: #1a73e8;
      font-weight: bold;
      border-radius: 6px 6px 0 0;
      cursor: pointer;
    }
    .tab-btn.active {
      background: #1a73e8;
      color: white;
    }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* 後台列表表格樣式 */
    .admin-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 14px;
    }
    .admin-table th, .admin-table td {
      border: 1px solid #ddd;
      padding: 8px 10px;
      text-align: left;
    }
    .admin-table th { background: #f1f5f9; }

    .admin-item-row, .admin-extra-field-row {
      background: #f8f9fa;
      border: 1px solid #ddd;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 12px;
      position: relative;
    }
    .del-item-btn {
      float: right;
      background: #d93025;
      color: white;
      border: none;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
    }
    .img-preview {
      max-width: 150px;
      max-height: 100px;
      border-radius: 4px;
      margin-top: 6px;
      display: none;
      border: 1px solid #ccc;
    }

    .required-badge {
      color: #d93025;
      font-size: 12px;
      border: 1px solid #d93025;
      border-radius: 3px;
      padding: 1px 5px;
      margin-left: 6px;
      font-weight: bold;
    }

    #loadingOverlay { display: none; text-align: center; margin-top: 15px; color: #1a73e8; font-weight: bold; }
    #successBox { display: none; text-align: center; padding: 20px; }
    .file-id-box {
      background: #e8f0fe;
      padding: 10px;
      font-size: 24px;
      font-weight: bold;
      color: #1a73e8;
      border-radius: 6px;
      margin: 10px 0;
    }
    .download-btn {
      display: inline-block;
      margin-top: 10px;
      padding: 12px 24px;
      background: #d93025;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- 頂部功能列 (前台已移除選單，僅保留檢核系統標題與後台登入) -->
  <div class="top-bar">
    <div class="top-bar-title">📋 班級表單填寫與檢核系統</div>
    <button class="admin-btn" onclick="openAdminLogin()">🔐 管理者後台設定</button>
  </div>

  <!-- 重複下載查詢區塊 -->
  <div class="query-card">
    <div style="font-weight: bold; color: #1a73e8;">🔍 查詢已填寫表單 (下載 PDF)</div>
    <div class="query-input-group">
      <input type="text" id="queryFileId" placeholder="請輸入 6 位數檔案 ID (例如：849201)">
      <button type="button" class="query-btn" onclick="queryPDF()">查詢</button>
    </div>
    <div id="queryResult"></div>
  </div>

  <!-- 前台填表畫面 -->
  <form id="mainForm">
    <h2 id="displayTitle">載入中...</h2>
    <div class="header-desc" id="displayDesc">正在讀取表單內容...</div>
    
    <!-- 標題參考網址與照片展示區 -->
    <div id="displayRefUrl" class="ref-link-box" style="display:none;"></div>
    <img id="displayImg" class="header-img-display" style="display:none;">

    <!-- 個人基本資料 -->
    <div class="input-group">
      <label><span id="displayUserNameLabel">填寫人姓名</span> <span style="color:red">*</span></label>
      <input type="text" id="userName" placeholder="請輸入姓名" required>
    </div>

    <!-- 班級使用版：年級、班級、座號欄位 -->
    <div class="class-info-group">
      <div class="class-info-item">
        <label>年級 <span style="color:red">*</span></label>
        <select id="userGrade" required>
          <option value="">請選擇年級</option>
        </select>
      </div>

      <div class="class-info-item">
        <label>班級 <span style="color:red">*</span></label>
        <select id="userClass" required>
          <option value="">請選擇班級</option>
          <option value="一班">一班</option>
          <option value="二班">二班</option>
          <option value="三班">三班</option>
          <option value="四班">四班</option>
        </select>
      </div>

      <div class="class-info-item">
        <label>座號 <span style="color:red">*</span></label>
        <input type="number" id="userSeat" min="1" max="99" placeholder="例如: 1" required>
      </div>
    </div>

    <!-- 動態渲染自訂延伸基本資料欄位 -->
    <div id="extraFieldsContainer"></div>

    <!-- 動態檢核題目渲染區 -->
    <div id="checklistContainer"></div>

    <!-- 手寫簽名 -->
    <div class="input-group">
      <label><span id="displaySignatureLabel">親筆簽名確認</span> <span style="color:red">*</span></label>
      <div class="signature-container">
        <canvas id="signatureCanvas" width="700" height="216"></canvas>
      </div>
      <button type="button" class="clear-btn" onclick="clearSignature()">清除重簽</button>
      <div style="clear: both;"></div>
    </div>

    <button type="submit" class="submit-btn" id="submitBtn">確認送出表單並生成 PDF</button>
    <div id="loadingOverlay">資料處理中，請稍候...</div>
  </form>

  <!-- 送出成功結果 -->
  <div id="successBox">
    <h3 style="color:#34a853;">🎉 表單與簽名已成功提交！</h3>
    <p>請保存您的專屬 6 位數檔案 ID：</p>
    <div class="file-id-box" id="resFileId">000000</div>
    <a href="#" target="_blank" class="download-btn" id="resDownloadBtn">📄 立即下載 PDF 檔</a>
    <br><br>
    <button type="button" onclick="location.reload()" style="padding:8px 16px; cursor:pointer;">填寫新表單</button>
  </div>
</div>

<!-- 管理者登入 Modal -->
<div class="modal-overlay" id="loginModal">
  <div class="modal-card" style="max-width: 400px;">
    <h3>🔐 管理者登入</h3>
    <div class="input-group">
      <label>請輸入管理者密碼：</label>
      <!-- [修改] 支援 Enter 鍵按鍵登入 -->
      <input type="password" id="adminPasswordInput" placeholder="請輸入密碼" onkeyup="if(event.key==='Enter') submitAdminLogin()">
    </div>
    <button class="query-btn" style="width:100%;" onclick="submitAdminLogin()">登入後台</button>
    <button style="width:100%; margin-top:8px;" onclick="closeModal('loginModal')">取消</button>
  </div>
</div>

<!-- 管理者後台設定 Modal -->
<div class="modal-overlay" id="adminModal">
  <div class="modal-card">
    <h3>⚙️ 管理者後台管理系統</h3>
    
    <!-- 後台分頁 Tab -->
    <div class="tab-bar">
      <button class="tab-btn active" onclick="switchAdminTab('tabFormConfig')">⚙️ 表單設定與編輯</button>
      <button class="tab-btn" onclick="switchAdminTab('tabPdfFiles'); loadAdminPdfList();">📄 PDF 檔管理</button>
      <button class="tab-btn" onclick="switchAdminTab('tabImageFiles'); loadAdminImageList();">🖼️ 附件照片管理</button>
    </div>

    <!-- 頁籤 1: 表單設定與編輯 -->
    <div id="tabFormConfig" class="tab-content active">
      <div class="input-group">
        <label>選擇要編輯的表單：</label>
        <select id="adminFormSelect" onchange="loadFormToAdmin()"></select>
        <button type="button" onclick="createNewFormInAdmin()" style="margin-top:5px;">➕ 新增全新表單</button>
      </div>

      <div class="input-group">
        <label>表單編號 (ID)：</label>
        <input type="text" id="adminFormId" readonly placeholder="系統自動生成">
      </div>

      <div class="input-group">
        <label>檢核主題 (標題)：</label>
        <input type="text" id="adminFormTitle" placeholder="請輸入表單主題">
      </div>

      <div class="input-group">
        <label>標題說明欄位 (表單說明)：</label>
        <textarea id="adminFormDesc" style="width:100%; height:80px; border-radius:6px; padding:8px;" placeholder="請輸入說明條文內容..."></textarea>
      </div>

      <div style="display:flex; gap:10px;">
        <div class="input-group" style="flex:1;">
          <label>「填寫人姓名」欄位名稱：</label>
          <input type="text" id="adminUserNameLabel" placeholder="預設：填寫人姓名">
        </div>
        <div class="input-group" style="flex:1;">
          <label>「親筆簽名」欄位名稱：</label>
          <input type="text" id="adminSignatureLabel" placeholder="預設：親筆簽名確認">
        </div>
      </div>

      <div style="background:#f1f5f9; padding:12px; border-radius:6px; border:1px solid #cbd5e1; margin-bottom:15px;">
        <h5 style="margin:0 0 8px 0; color:#1e293b;">自訂延伸基本資料欄位 (如：家長電話)</h5>
        <div id="adminExtraFieldsContainer"></div>
        <button type="button" onclick="addAdminExtraFieldRow()" style="padding:5px 10px; background:#475569; color:white; border:none; border-radius:4px; cursor:pointer;">➕ 新增基本資料欄位</button>
      </div>

      <div class="input-group" style="background:#f8f9fa; padding:10px; border-radius:6px; border:1px solid #ddd;">
        <label style="color:#1a73e8;">自訂年級下拉選單 (以逗號分隔)：</label>
        <input type="text" id="adminGradeOptions" placeholder="一年,二年,三年,四年,五年,六年">
      </div>

      <div class="input-group" style="background:#eef3fc; padding:10px; border-radius:6px; border:1px solid #c2d7fa;">
        <label style="color:#1a73e8;">全表單最少需勾選數量：</label>
        <input type="number" id="adminMinRequiredCount" min="0" value="0" placeholder="0">
      </div>

      <div class="input-group">
        <label>檢核主題參考網址 (選擇性)：</label>
        <input type="url" id="adminFormRefUrl" placeholder="https://...">
      </div>

      <div class="input-group">
        <label>檢核主題照片附件 (限制 1MB 以內)：</label>
        <input type="file" id="adminFormImgFile" accept="image/*" onchange="handleImageUpload(this, 'adminFormImgPreview', 'adminFormImgBase64')">
        <input type="hidden" id="adminFormImgBase64">
        <img id="adminFormImgPreview" class="img-preview">
        <button type="button" onclick="clearImageUpload('adminFormImgFile', 'adminFormImgPreview', 'adminFormImgBase64')" style="display:none;" id="clearHeaderImgBtn">清除照片</button>
      </div>

      <hr style="margin:20px 0;">

      <h4>檢核項目設定</h4>
      <div id="adminItemsContainer"></div>
      <button type="button" onclick="addAdminItemRow()" style="padding:8px 14px; background:#1a73e8; color:white; border:none; border-radius:4px; cursor:pointer; font-weight:bold;">➕ 新增檢核項目</button>

      <br><br>
      <div id="adminFormUrlBox" style="background:#e8f0fe; padding:10px; border-radius:6px; font-size:13px; display:none; word-break:break-all;"></div>
      <br>

      <div id="adminSaveStatus" style="font-weight:bold; color:green; margin-bottom:8px; display:none;"></div>
      <button type="button" class="submit-btn" id="saveAdminFormBtn" onclick="saveAdminFormConfig()">💾 儲存表單設定</button>
    </div>

    <!-- 頁籤 2: PDF 檔案檢視與刪除 -->
    <div id="tabPdfFiles" class="tab-content">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <h4 style="margin:0;">📁 雲端硬碟 PDF 檔案列表</h4>
        <button type="button" onclick="loadAdminPdfList()" style="padding:4px 10px;">🔄 重整清單</button>
      </div>
      <div id="pdfListContainer">資料讀取中...</div>
    </div>

    <!-- 頁籤 3: 附件照片檔檢視與刪除 -->
    <div id="tabImageFiles" class="tab-content">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <h4 style="margin:0;">🖼️ 雲端硬碟照片附件列表</h4>
        <button type="button" onclick="loadAdminImageList()" style="padding:4px 10px;">🔄 重整清單</button>
      </div>
      <div id="imageListContainer">資料讀取中...</div>
    </div>

    <br>
    <button type="button" style="width:100%; margin-top:8px; padding:10px; font-weight:bold;" onclick="closeModal('adminModal')">關閉後台</button>
  </div>
</div>

<script>
  // 發佈之 CSV 網址 (用於極速讀取前台內容)
  const CONFIG_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSLhyKrfe933mNx7pMrgfoucQqQrL5B6NuGQ1CBke7xQhvoGQz0vnT3-ZeL57JsKgTPiYjFQUXfXERF/pub?gid=1778083626&single=true&output=csv";
  
  // Apps Script Web App URL (用於後台儲存、提交表單、刪除檔案)
  const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycby7Y7VEUZIYyAV74AAClExnkRtRuxBOkuc2vu4blsQcO-pT1ArZFHTnEg8UzFEfBwSvkw/exec";

  let currentFormId = "";
  let currentFormConfig = null;
  let adminPasswordToken = "";
  let allParsedForms = [];

  // CSV 高效解析器 (處理包含 JSON 與雙引號的情況)
  function parseCSV(text) {
    const result = [];
    let row = [];
    let cell = '';
    let inQuotes = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      const nextC = text[i + 1];
      if (inQuotes) {
        if (c === '"') {
          if (nextC === '"') { cell += '"'; i++; } 
          else { inQuotes = false; }
        } else { cell += c; }
      } else {
        if (c === '"') { inQuotes = true; } 
        else if (c === ',') { row.push(cell); cell = ''; } 
        else if (c === '\r' && nextC === '\n') { row.push(cell); result.push(row); row = []; cell = ''; i++; } 
        else if (c === '\n' || c === '\r') { row.push(cell); result.push(row); row = []; cell = ''; } 
        else { cell += c; }
      }
    }
    if (cell || row.length > 0) { row.push(cell); result.push(row); }
    return result;
  }

  // 網頁載入初始化 (改為從發佈之 CSV 直接讀取，達成秒開 speedup)
  window.addEventListener('load', () => {
    initCanvas();
    const urlParams = new URLSearchParams(window.location.search);
    const formIdFromUrl = urlParams.get('formId');
    loadFormFromCSV(formIdFromUrl);
  });

  // 從 CSV 極速讀取表單資料
  function loadFormFromCSV(targetFormId) {
    fetch(CONFIG_CSV_URL + "&t=" + new Date().getTime())
      .then(res => res.text())
      .then(csvText => {
        const rows = parseCSV(csvText);
        allParsedForms = [];
        
        for (let i = 1; i < rows.length; i++) {
          const row = rows[i];
          if (row && row[0]) {
            let cleanItemsStr = (row[3] || "[]").trim();
            if (cleanItemsStr.startsWith("'")) cleanItemsStr = cleanItemsStr.substring(1);
            let cleanExtraStr = (row[11] || "[]").trim();
            if (cleanExtraStr.startsWith("'")) cleanExtraStr = cleanExtraStr.substring(1);

            let items = [], extraFields = [];
            try { items = JSON.parse(cleanItemsStr); } catch(e){}
            try { extraFields = JSON.parse(cleanExtraStr); } catch(e){}

            allParsedForms.push({
              formId: row[0].trim(),
              formTitle: row[1] || "",
              formDesc: row[2] || "",
              items: items,
              createdAt: row[4] || "",
              formImgBase64: row[5] || "",
              formRefUrl: row[6] || "",

              signatureLabel: row[10] || "親筆簽名確認",
              extraFields: extraFields
            });
          }
        }

        if (allParsedForms.length > 0) {
          let selected = allParsedForms.find(f => f.formId === targetFormId);
          if (!selected) selected = allParsedForms[0];
          
          currentFormId = selected.formId;

      });
  }

  // 照片上傳壓縮引擎
  function handleImageUpload(fileInput, previewImgId, base64HiddenId) {
    const file = fileInput.files[0];
    if (!file) return;

    if (file.size > 1048576) {
      alert("⚠️ 照片附件檔案大小不能超過 1MB！");
      fileInput.value = "";
      return;
    }

    const reader = new FileReader();
    reader.onload = function(e) {
      const img = new Image();
      img.onload = function() {
        const canvas = document.createElement('canvas');
        const maxWidth = 500;
        let width = img.width, height = img.height;

        if (width > maxWidth) {
          height = Math.round((height * maxWidth) / width);
          width = maxWidth;
        }

        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);

        const compressedBase64 = canvas.toDataURL('image/jpeg', 0.6);

        document.getElementById(base64HiddenId).value = compressedBase64;
        const preview = document.getElementById(previewImgId);
        preview.src = compressedBase64;
        preview.style.display = 'block';

        const clearBtn = previewImgId === 'adminFormImgPreview' ? document.getElementById('clearHeaderImgBtn') : null;
        if (clearBtn) clearBtn.style.display = 'inline-block';
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function clearImageUpload(fileInputId, previewImgId, base64HiddenId) {
    document.getElementById(fileInputId).value = "";
    document.getElementById(base64HiddenId).value = "";
    const preview = document.getElementById(previewImgId);

  // 手寫簽名引擎
  const canvas = document.getElementById('signatureCanvas');
  const ctx = canvas.getContext('2d');
  let isDrawing = false, hasSigned = false, lastX = 0, lastY = 0;

  function initCanvas() {
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = '#000000';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
  }

  function getCanvasCoords(e) {
    const rect = canvas.getBoundingClientRect();
    let clientX = e.clientX, clientY = e.clientY;
    if (e.touches && e.touches.length > 0) {
      clientX = e.touches[0].clientX; clientY = e.touches[0].clientY;
    }
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
  }

  function startDrawing(e) {
    e.preventDefault(); isDrawing = true;
    const pos = getCanvasCoords(e); lastX = pos.x; lastY = pos.y;
    ctx.beginPath(); ctx.arc(lastX, lastY, 1.5, 0, Math.PI * 2); ctx.fill(); hasSigned = true;
  }
  function draw(e) {
    if (!isDrawing) return; e.preventDefault();
    const pos = getCanvasCoords(e);
    ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.lineTo(pos.x, pos.y); ctx.stroke();
    lastX = pos.x; lastY = pos.y; hasSigned = true;
  }
  function stopDrawing() { isDrawing = false; }

  canvas.addEventListener('mousedown', startDrawing); canvas.addEventListener('mousemove', draw); window.addEventListener('mouseup', stopDrawing);
  canvas.addEventListener('touchstart', startDrawing); canvas.addEventListener('touchmove', draw); canvas.addEventListener('touchend', stopDrawing);

  function clearSignature() {
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, canvas.width, canvas.height); hasSigned = false;
  }

  // 前台送出填寫表單
  document.getElementById('mainForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const checkboxes = document.querySelectorAll('.rule-check');
    const checkedBoxes = document.querySelectorAll('.rule-check:checked');

    let missingRequiredList = [];
    checkboxes.forEach((box) => {
      const idx = box.getAttribute('data-index');
      const itemObj = currentFormConfig.items[idx];
      if (itemObj.required && !box.checked) {
        missingRequiredList.push(`第 ${parseInt(idx) + 1} 題：${itemObj.title}`);
      }
    });

    if (missingRequiredList.length > 0) {
      return alert("⚠️ 以下為「必選項」，請確認勾選：\n\n• " + missingRequiredList.join("\n• "));
    }

    const minReqCount = parseInt(currentFormConfig.minRequiredCount || 0, 10);
    if (minReqCount > 0 && checkedBoxes.length < minReqCount) {
      return alert(`⚠️ 本表單設定最少需勾選 ${minReqCount} 項！（您目前已勾選 ${checkedBoxes.length} 項）`);
    }

    const grade = document.getElementById('userGrade').value;
    const userClass = document.getElementById('userClass').value;
    const seat = document.getElementById('userSeat').value.trim();

    if (!grade || !userClass || !seat) {
      return alert("請完整選擇並填寫【年級、班級與座號】！");
    }

    const extraInputs = document.querySelectorAll('.user-extra-input');
    let extraFieldData = [];
    let missingExtraLabels = [];

    extraInputs.forEach(input => {
      const lbl = input.getAttribute('data-label');
      const isReq = input.getAttribute('data-required') === 'true';
      const val = input.value.trim();

      if (isReq && !val) missingExtraLabels.push(lbl);
      extraFieldData.push({ label: lbl, value: val });
    });

    if (missingExtraLabels.length > 0) {
      return alert("⚠️ 請填寫以下必填欄位：\n\n• " + missingExtraLabels.join("\n• "));
    }

    if (!hasSigned) {
      let sigLbl = currentFormConfig.signatureLabel || "親筆簽名確認";
      if (sigLbl.startsWith("[") || sigLbl.startsWith("{")) sigLbl = "親筆簽名確認";
      return alert(`請完成【${sigLbl}】！`);
    }

    const submitBtn = document.getElementById('submitBtn');
    const loadingOverlay = document.getElementById('loadingOverlay');
    submitBtn.disabled = true;
    loadingOverlay.style.display = 'block';

    let checkedItemsDetail = [];
    checkboxes.forEach((box) => {
      if (box.checked) {
        const idx = box.getAttribute('data-index');
        const itemObj = currentFormConfig.items[idx];
        checkedItemsDetail.push({
          title: itemObj.title,
          desc: itemObj.desc || "",
          refUrl: itemObj.refUrl || "",
          imgBase64: itemObj.imgBase64 || ""
        });
      }
    });

    const payload = {
      action: 'submitForm',
      formId: currentFormId,
      formTitle: currentFormConfig.formTitle,
      formDesc: currentFormConfig.formDesc,
      formRefUrl: currentFormConfig.formRefUrl || "",
      formImgBase64: currentFormConfig.formImgBase64 || "",
      userNameLabel: currentFormConfig.userNameLabel || "填寫人姓名",
      signatureLabel: currentFormConfig.signatureLabel || "親筆簽名確認",
      userName: document.getElementById('userName').value.trim(),
      classGroup: `${grade}${userClass}`,
      seatNo: seat,
      extraFieldData: extraFieldData,
      checkedCount: checkedBoxes.length,
      totalCount: checkboxes.length,
      checkedItemsDetail: checkedItemsDetail,
      signatureBase64: canvas.toDataURL('image/png')
    };

    fetch(GAS_WEB_APP_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(data => {
      if (data.result === 'success') {
        document.getElementById('mainForm').style.display = 'none';
        document.getElementById('successBox').style.display = 'block';
        document.getElementById('resFileId').innerText = data.fileId;
        document.getElementById('resDownloadBtn').href = data.downloadUrl;
      } else {
        alert("提交失敗：" + data.message);
        submitBtn.disabled = false;
        loadingOverlay.style.display = 'none';
      }
    });
  });

    const formRefUrl = document.getElementById('adminFormRefUrl').value.trim();
    const formImgBase64 = document.getElementById('adminFormImgBase64').value;
    
    let userNameLabel = document.getElementById('adminUserNameLabel').value.trim() || "填寫人姓名";
    let signatureLabel = document.getElementById('adminSignatureLabel').value.trim() || "親筆簽名確認";

    const minRequiredCount = document.getElementById('adminMinRequiredCount').value || 0;
    const gradeOptions = document.getElementById('adminGradeOptions').value.trim() || "一年,二年,三年,四年,五年,六年";

    if (!formTitle) return alert("請填寫表單主題！");

    const extraRows = document.querySelectorAll('.admin-extra-field-row');
    let extraFields = [];
    extraRows.forEach(row => {
      const lbl = row.querySelector('.admin-extra-label').value.trim();
      const isReq = row.querySelector('.admin-extra-required').checked;
      if (lbl) extraFields.push({ label: lbl, required: isReq });
    });

    const itemRows = document.querySelectorAll('.admin-item-row');
    let items = [];
    itemRows.forEach(row => {
      const t = row.querySelector('.admin-item-title').value.trim();
      const d = row.querySelector('.admin-item-desc').value.trim();
      const u = row.querySelector('.admin-item-refurl').value.trim();
      const img = row.querySelector('.admin-item-img-base64').value;
      const isReq = row.querySelector('.admin-item-required').checked;

      if (t) items.push({ title: t, desc: d, refUrl: u, imgBase64: img, required: isReq });
    });

    saveBtn.innerText = "⏳ 儲存中...";
    saveBtn.disabled = true;

    const payload = {
      action: 'saveFormConfig',
      password: adminPasswordToken,
      formId: formId,
      formTitle: formTitle,
      formDesc: formDesc,
      formRefUrl: formRefUrl,
      formImgBase64: formImgBase64,
      userNameLabel: userNameLabel,
      signatureLabel: signatureLabel,
      extraFields: extraFields,
      minRequiredCount: minRequiredCount,
      gradeOptions: gradeOptions,
      items: items
    };

    fetch(GAS_WEB_APP_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(data => {
      saveBtn.innerText = "💾 儲存表單設定";
      saveBtn.disabled = false;

      if (data.result === 'success') {
        saveStatus.style.display = 'block';
        saveStatus.innerText = data.message;
        setTimeout(() => { saveStatus.style.display = 'none'; }, 4000);

        document.getElementById('adminFormId').value = data.formId;
        
        // 重新重新載入資料 (不安裝/不關閉 Modal)
        loadFormFromCSV(data.formId);
        alert(data.message);
      } else {
        alert("儲存失敗：" + data.message);
      }
    })
    .catch(err => {
      saveBtn.innerText = "💾 儲存表單設定";
      saveBtn.disabled = false;
      alert("儲存失敗：" + err.toString());
    });
  }

  // [新增] 載入 PDF 檔案列表
  function loadAdminPdfList() {
    const container = document.getElementById('pdfListContainer');
    container.innerHTML = "資料載入中...";

    fetch(GAS_WEB_APP_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'getPdfList', password: adminPasswordToken })
    })
    .then(res => res.json())
    .then(data => {
      if (data.result === 'success') {
        if (data.list.length === 0) {
          container.innerHTML = "<p>目前尚無任何 PDF 檔案紀錄。</p>";
          return;
        }

        let html = `
          <table class="admin-table">
            <thead>
              <tr>
                <th>檔名</th>
                <th>大小</th>
                <th>建立時間</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody>
        `;
        data.list.forEach(file => {
          html += `
            <tr>
              <td><b>${file.name}</b></td>
              <td>${file.size}</td>
              <td>${file.created}</td>
              <td>
                <a href="${file.url}" target="_blank" style="color:#1a73e8; font-weight:bold; margin-right:8px;">📄 檢視/下載</a>
                <button type="button" onclick="deletePdfFile('${file.id}', '${file.name}')" style="background:#d93025; color:white; border:none; padding:3px 8px; border-radius:4px; cursor:pointer;">🗑️ 刪除</button>
              </td>
            </tr>
          `;
        });
        html += "</tbody></table>";
        container.innerHTML = html;
      } else {
        container.innerHTML = "<p style='color:red;'>讀取失敗：" + data.message + "</p>";
      }
    });
  }

  function deletePdfFile(fileId, fileName) {
    if (!confirm(`確定要刪除 PDF 檔案【${fileName}】嗎？刪除後無法復原！`)) return;

    fetch(GAS_WEB_APP_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'deletePdfFile', password: adminPasswordToken, fileId: fileId })
    })
    .then(res => res.json())
    .then(data => {
      alert(data.message);
      if (data.result === 'success') loadAdminPdfList();
    });
  }

  // [新增] 載入附件照片列表

    container.innerHTML = "資料載入中...";

    fetch(GAS_WEB_APP_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'getImageList', password: adminPasswordToken })
    })
    .then(res => res.json())
    .then(data => {
      if (data.result === 'success') {
        if (data.list.length === 0) {
          container.innerHTML = "<p>目前尚無任何照片附件檔案。</p>";
          return;
        }

        let html = `
          <table class="admin-table">
            <thead>
              <tr>
                <th>預覽圖</th>
                <th>檔名</th>
                <th>大小</th>
                <th>建立時間</th>
                <th>操作</th>
              </tr>
            </thead>

        `;
        data.list.forEach(file => {
          html += `

              <td><img src="${file.url}" style="width:60px; height:60px; object-fit:cover; border-radius:4px; border:1px solid #ccc;"></td>

              <td>${file.size}</td>
              <td>${file.created}</td>
              <td>
                <a href="${file.url}" target="_blank" style="color:#1a73e8; font-weight:bold; margin-right:8px;">🖼️ 開啟原圖</a>
                <button type="button" onclick="deleteImageFile('${file.id}', '${file.name}')" style="background:#d93025; color:white; border:none; padding:3px 8px; border-radius:4px; cursor:pointer;">🗑️ 刪除</button>
              </td>
            </tr>
          `;
        });
        html += "</tbody></table>";
        container.innerHTML = html;
      } else {
        container.innerHTML = "<p style='color:red;'>讀取失敗：" + data.message + "</p>";
      }
    });
  }

  function deleteImageFile(fileId, fileName) {
    if (!confirm(`確定要刪除照片檔案【${fileName}】嗎？刪除後無法復原！`)) return;

    fetch(GAS_WEB_APP_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'deleteImageFile', password: adminPasswordToken, fileId: fileId })
    })
    .then(res => res.json())
    .then(data => {
      alert(data.message);
      if (data.result === 'success') loadAdminImageList();
    });
  }
