<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>班級同意書表單系統</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background-color: #f4f6f9;
      margin: 0;
      padding: 15px 10px;
      color: #333;
    }
    .container {
      max-width: 820px;
      margin: 0 auto;
      background: #ffffff;
      padding: 25px 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1a73e8;
      color: white;
      padding: 12px 18px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    .top-bar h3 { margin: 0; font-size: 18px; }
    .admin-btn {
      background: #fbbc04;
      color: #202124;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }
    .admin-btn:hover { background: #f29900; }

    .query-card {
      background-color: #eef3fc;
      border: 1px solid #c2d7fa;
      border-radius: 8px;
      padding: 12px 18px;
      margin-bottom: 20px;
    }
    .query-input-group {
      display: flex;
      gap: 10px;
      margin-top: 6px;
    }
    .query-input-group input {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .query-btn {
      padding: 8px 16px;
      background-color: #1a73e8;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    h2 { text-align: center; color: #1a73e8; margin-top: 0; }
    .header-desc {
      font-size: 14px;
      color: #5f6368;
      line-height: 1.6;
      background-color: #f8f9fa;
      border: 1px solid #e8eaed;
      padding: 12px 15px;
      border-radius: 6px;
      margin-bottom: 15px;
      white-space: pre-wrap;
    }

    .ref-link-box {
      background: #f0f7ff;
      border: 1px solid #c2d7fa;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13.5px;
      margin-bottom: 15px;
      word-break: break-all;
    }
    .ref-link-box a { color: #1a73e8; font-weight: bold; text-decoration: underline; }

    .header-img-display {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      margin-bottom: 15px;
      display: block;
    }

    .section-card {
      background: #fafafa;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 18px 20px;
      margin-bottom: 20px;
    }
    .checkbox-item {
      display: flex;
      align-items: flex-start;
      margin-bottom: 10px;
      font-size: 15px;
      line-height: 1.5;
      cursor: pointer;
    }
    .checkbox-item input[type="checkbox"] {
      width: 20px;
      height: 20px;
      margin-right: 12px;
      margin-top: 2px;
      flex-shrink: 0;
    }
    .item-desc-box {
      background-color: #f0f7ff;
      border-left: 4px solid #1a73e8;
      padding: 8px 12px;
      font-size: 13px;
      color: #333;
      margin-top: 4px;
      margin-bottom: 10px;
      margin-left: 32px;
      border-radius: 0 4px 4px 0;
      line-height: 1.5;
      white-space: pre-wrap;
    }
    .item-img-display {
      max-width: 280px;
      max-height: 200px;
      border-radius: 6px;
      margin-top: 6px;
      margin-bottom: 10px;
      margin-left: 32px;
      display: block;
      border: 1px solid #ddd;
    }

    .input-group { margin-bottom: 15px; }
    .input-group label { display: block; font-weight: bold; margin-bottom: 5px; }
    .input-group input, .input-group select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }

    .class-info-group {
      display: flex;
      gap: 12px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }
    .class-info-item {
      flex: 1;
      min-width: 100px;
    }
    .class-info-item label { display: block; font-weight: bold; margin-bottom: 5px; }
    .class-info-item select, .class-info-item input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }

    .signature-container {
      border: 2px dashed #1a73e8;
      border-radius: 8px;
      background-color: #ffffff;
      margin-top: 8px;
    }
    canvas#signatureCanvas {
      width: 100%;
      height: 216px;
      display: block;
      cursor: crosshair;
    }
    .clear-btn {
      float: right;
      margin-top: 6px;
      background: #e0e0e0;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      background-color: #34a853;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
    }
    .submit-btn:hover { background-color: #2d8e47; }
    .submit-btn:disabled { background-color: #cccccc; cursor: not-allowed; }

    .modal-overlay {
      display: none;
      position: fixed;
      top:0; left:0; right:0; bottom:0;
      background: rgba(0,0,0,0.6);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 10px;
    }
    .modal-card {
      background: white;
      border-radius: 10px;
      padding: 25px;
      width: 100%;
      max-width: 820px;
      max-height: 90vh;
      overflow-y: auto;
    }

    /* 後台頁籤 (Tabs) 樣式 */
    .admin-tab-nav {
      display: flex;
      gap: 6px;
      border-bottom: 2px solid #e2e8f0;
      margin-bottom: 18px;
    }
    .admin-tab-btn {
      padding: 10px 16px;
      background: #f1f5f9;
      border: none;
      border-radius: 6px 6px 0 0;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      color: #64748b;
      transition: all 0.2s;
    }
    .admin-tab-btn:hover { background: #e2e8f0; color: #334155; }
    .admin-tab-btn.active {
      background: #1a73e8;
      color: white;
    }
    .admin-tab-content { display: none; }
    .admin-tab-content.active { display: block; }

    /* 後台列表表格與網格樣式 */
    .admin-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 13.5px;
    }
    .admin-table th, .admin-table td {
      border: 1px solid #e2e8f0;
      padding: 8px 10px;
      text-align: left;
    }
    .admin-table th { background: #f8fafc; color: #475569; }

    .photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 15px;
      margin-top: 12px;
    }
    .photo-card {
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 10px;
      background: #fafafa;
      text-align: center;
    }
    .photo-card img {
      width: 100%;
      height: 120px;
      object-fit: cover;
      border-radius: 4px;
      margin-bottom: 8px;
      border: 1px solid #ddd;
    }
    .photo-card .info {
      font-size: 12px;
      color: #64748b;
      margin-bottom: 8px;
      word-break: break-all;
    }

    .admin-item-row, .admin-extra-field-row {
      background: #f8f9fa;
      border: 1px solid #ddd;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 12px;
      position: relative;
    }
    .del-item-btn {
      float: right;
      background: #d93025;
      color: white;
      border: none;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
    }
    .img-preview {
      max-width: 150px;
      max-height: 100px;
      border-radius: 4px;
      margin-top: 6px;
      display: none;
      border: 1px solid #ccc;
    }

    .required-badge {
      color: #d93025;
      font-size: 12px;
      border: 1px solid #d93025;
      border-radius: 3px;
      padding: 1px 5px;
      margin-left: 6px;
      font-weight: bold;
    }

    #loadingOverlay { display: none; text-align: center; margin-top: 15px; color: #1a73e8; font-weight: bold; }
    #successBox { display: none; text-align: center; padding: 20px; }
    .file-id-box {
      background: #e8f0fe;
      padding: 10px;
      font-size: 24px;
      font-weight: bold;
      color: #1a73e8;
      border-radius: 6px;
      margin: 10px 0;
    }
    .download-btn {
      display: inline-block;
      margin-top: 10px;
      padding: 12px 24px;
      background: #d93025;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- 頂部標題與後台登入按鈕 -->
  <div class="top-bar">
    <h3>📋 班級同意書線上簽署系統</h3>
    <button type="button" class="admin-btn" onclick="openAdminLogin()">🔐 管理者後台設定</button>
  </div>

  <!-- 查詢區塊 (支援 Enter 鍵) -->
  <div class="query-card">
    <div style="font-weight: bold; color: #1a73e8;">🔍 查詢已填寫表單 (下載 PDF)</div>
    <div class="query-input-group">
      <input type="text" id="queryFileId" placeholder="請輸入 6 位數檔案 ID (例如：849201)" onkeydown="if(event.key==='Enter'){ event.preventDefault(); queryPDF(); }">
      <button type="button" class="query-btn" onclick="queryPDF()">查詢</button>
    </div>
    <div id="queryResult"></div>
  </div>

  <!-- 前台填表畫面 -->
  <form id="mainForm">
    <h2 id="displayTitle">載入中...</h2>
    <div class="header-desc" id="displayDesc">正在載入同意書內容...</div>
    
    <div id="displayRefUrl" class="ref-link-box" style="display:none;"></div>
    <img id="displayImg" class="header-img-display" style="display:none;">

    <!-- 個人基本資料 -->
    <div class="input-group">
      <label><span id="displayUserNameLabel">學生姓名</span> <span style="color:red">*</span></label>
      <input type="text" id="userName" placeholder="請輸入姓名" required>
    </div>

    <!-- 年級、班級、座號欄位 -->
    <div class="class-info-group">
      <div class="class-info-item">
        <label>年級 <span style="color:red">*</span></label>
        <select id="userGrade" required>
          <option value="">請選擇年級</option>
        </select>
      </div>

      <div class="class-info-item">
        <label>班級 <span style="color:red">*</span></label>
        <select id="userClass" required>
          <option value="">請選擇班級</option>
          <option value="一班">一班</option>
          <option value="二班">二班</option>
          <option value="三班">三班</option>
          <option value="四班">四班</option>
        </select>
      </div>

      <div class="class-info-item">
        <label>座號 <span style="color:red">*</span></label>
        <input type="number" id="userSeat" min="1" max="99" placeholder="例如: 1" required>
      </div>
    </div>

    <!-- 自訂延伸欄位 -->
    <div id="extraFieldsContainer"></div>

    <!-- 檢核題目區 -->
    <div id="checklistContainer"></div>

    <!-- 手寫簽名 -->
    <div class="input-group">
      <label><span id="displaySignatureLabel">親筆簽名確認</span> <span style="color:red">*</span></label>
      <div class="signature-container">
        <canvas id="signatureCanvas" width="700" height="216"></canvas>
      </div>
      <button type="button" class="clear-btn" onclick="clearSignature()">清除重簽</button>
      <div style="clear: both;"></div>
    </div>

    <button type="submit" class="submit-btn" id="submitBtn">確認送出表單並生成 PDF</button>
    <div id="loadingOverlay">資料處理中，請稍候...</div>
  </form>

  <!-- 送出成功結果 -->
  <div id="successBox">
    <h3 style="color:#34a853;">🎉 同意書已成功提交！</h3>
    <p>請保存您的專屬 6 位數檔案 ID：</p>
    <div class="file-id-box" id="resFileId">000000</div>
    <a href="#" target="_blank" class="download-btn" id="resDownloadBtn">📄 立即下載 PDF 檔</a>
    <br><br>
    <button type="button" onclick="location.reload()" style="padding:8px 16px; cursor:pointer;">填寫新同意書</button>
  </div>
</div>

<!-- 管理者登入 Modal -->
<div class="modal-overlay" id="loginModal">
  <div class="modal-card" style="max-width: 400px;">
    <h3>🔐 管理者登入</h3>
    <form onsubmit="event.preventDefault(); submitAdminLogin();">
      <div class="input-group">
        <label>請輸入管理者密碼：</label>
        <input type="password" id="adminPasswordInput" placeholder="請輸入密碼" onkeydown="if(event.key==='Enter'){ event.preventDefault(); submitAdminLogin(); }">
      </div>
      <button type="submit" class="query-btn" style="width:100%;" id="adminLoginBtn">登入後台</button>
      <button type="button" style="width:100%; margin-top:8px;" onclick="closeModal('loginModal')">取消</button>
    </form>
  </div>
</div>

<!-- 管理者後台 Modal (包含三個頁籤) -->
<div class="modal-overlay" id="adminModal">
  <div class="modal-card">
    <h3 style="margin-bottom:12px;">⚙️ 班級同意書管理者後台</h3>
    
    <!-- 後台頁籤選單 -->
    <div class="admin-tab-nav">
      <button type="button" class="admin-tab-btn active" onclick="switchAdminTab('config')">⚙️ 表單設置</button>
      <button type="button" class="admin-tab-btn" onclick="switchAdminTab('pdf')">📄 PDF 同意書管理</button>
      <button type="button" class="admin-tab-btn" onclick="switchAdminTab('photo')">🖼️ 照片附件管理</button>
    </div>

    <!-- 頁籤 1：表單設置 -->
    <div class="admin-tab-content active" id="tab-config">
      <div class="input-group">
        <label>同意書主題 (標題)：</label>
        <input type="text" id="adminFormTitle" placeholder="例如：113學年度家長同意書">
      </div>

      <div class="input-group">
        <label>標題說明欄位 (同意書內容條文)：</label>
        <textarea id="adminFormDesc" style="width:100%; height:80px; border-radius:6px; padding:8px;" placeholder="請輸入說明條文內容..."></textarea>
      </div>

      <div style="display:flex; gap:10px;">
        <div class="input-group" style="flex:1;">
          <label>「填寫人姓名」欄位名稱：</label>
          <input type="text" id="adminUserNameLabel" placeholder="預設：學生姓名">
        </div>
        <div class="input-group" style="flex:1;">
          <label>「親筆簽名」欄位名稱：</label>
          <input type="text" id="adminSignatureLabel" placeholder="預設：家長簽名確認">
        </div>
      </div>

      <div style="background:#f1f5f9; padding:12px; border-radius:6px; border:1px solid #cbd5e1; margin-bottom:15px;">
        <h5 style="margin:0 0 8px 0; color:#1e293b;">自訂延伸基本資料欄位 (如：家長電話、緊急聯絡人等)</h5>
        <div id="adminExtraFieldsContainer"></div>
        <button type="button" onclick="addAdminExtraFieldRow()" style="padding:5px 10px; background:#475569; color:white; border:none; border-radius:4px; cursor:pointer;">➕ 新增基本資料欄位</button>
      </div>

      <div class="input-group" style="background:#f8f9fa; padding:10px; border-radius:6px; border:1px solid #ddd;">
        <label style="color:#1a73e8;">自訂年級下拉選單 (以逗號分隔)：</label>
        <input type="text" id="adminGradeOptions" placeholder="例如：一年,二年,三年 或 幼兒園,一年">
      </div>

      <div class="input-group" style="background:#eef3fc; padding:10px; border-radius:6px; border:1px solid #c2d7fa;">
        <label style="color:#1a73e8;">全表單最少需勾選數量 (0 表不限制數量)：</label>
        <input type="number" id="adminMinRequiredCount" min="0" value="0" placeholder="0">
      </div>

      <div class="input-group">
        <label>參考網址 (選擇性)：</label>
        <input type="url" id="adminFormRefUrl" placeholder="例如：https://school.edu.tw/...">
      </div>

      <div class="input-group">
        <label>主題照片附件 (限制 1MB 以內，選擇性)：</label>
        <input type="file" id="adminFormImgFile" accept="image/*" onchange="handleImageUpload(this, 'adminFormImgPreview', 'adminFormImgBase64')">
        <input type="hidden" id="adminFormImgBase64">
        <img id="adminFormImgPreview" class="img-preview">
        <button type="button" onclick="clearImageUpload('adminFormImgFile', 'adminFormImgPreview', 'adminFormImgBase64')" style="display:none;" id="clearHeaderImgBtn">清除照片</button>
      </div>

      <hr style="margin:20px 0;">

      <h4>同意條款項目設定</h4>
      <div id="adminItemsContainer"></div>
      <button type="button" onclick="addAdminItemRow()" style="padding:8px 14px; background:#1a73e8; color:white; border:none; border-radius:4px; cursor:pointer; font-weight:bold;">➕ 新增同意條款</button>

      <br><br>
      <button type="button" class="submit-btn" id="saveAdminFormBtn" onclick="saveAdminFormConfig()">💾 儲存同意書設定</button>
    </div>

    <!-- 頁籤 2：PDF 同意書管理 -->
    <div class="admin-tab-content" id="tab-pdf">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <span style="font-weight:bold; color:#1a73e8;">📄 已生成的 PDF 同意書列表</span>
        <button type="button" onclick="fetchAdminFileList()" style="padding:6px 12px; background:#f1f5f9; border:1px solid #ccc; border-radius:4px; cursor:pointer;">🔄 重新整理</button>
      </div>
      <div id="pdfLoadingText" style="margin-top:15px; color:#666;">資料載入中...</div>
      <div style="overflow-x:auto;">
        <table class="admin-table" id="pdfTable" style="display:none;">
          <thead>
            <tr>
              <th>檔案名稱</th>
              <th>建立時間</th>
              <th>大小</th>
              <th>檢視/下載</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="pdfTableBody"></tbody>
        </table>
      </div>
    </div>

    <!-- 頁籤 3：照片附件管理 -->
    <div class="admin-tab-content" id="tab-photo">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <span style="font-weight:bold; color:#1a73e8;">🖼️ 照片附件圖庫</span>
        <button type="button" onclick="fetchAdminFileList()" style="padding:6px 12px; background:#f1f5f9; border:1px solid #ccc; border-radius:4px; cursor:pointer;">🔄 重新整理</button>
      </div>
      <div id="photoLoadingText" style="margin-top:15px; color:#666;">資料載入中...</div>
      <div class="photo-grid" id="photoGrid"></div>
    </div>

    <br>
    <button type="button" style="width:100%; padding:12px; background:#6c757d; color:white; border:none; border-radius:6px; font-weight:bold; cursor:pointer;" onclick="closeModal('adminModal')">❌ 關閉後台</button>
  </div>
</div>

<script>
  // 1. GAS 寫入與提交 API 網址
  const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwN3SJodr8qf3ZFyIWRXeyK6l5magmiZuTdrnw4QQ8FhJ3nQjLzFG4XRUXuIZ87d5Ty/exec";
  
  // 2. 試算表 CSV 直連網址 (前台超高速讀取)
  const SPREADSHEET_ID = "1GT53RxyCBln6uuhUiDitauGfcbSoNQ1Q2ePT_kTsPqw";
  const CSV_URL = `https://docs.google.com/spreadsheets/d/e/2PACX-1vQWgP_-GLR3ljSXPsMjqYXsEnsa5zRgCAY1BrbtBOI_W1vAqF-d5r32zBv09JfysNhPCUthBTFvOhAJ/pub?gid=941265157&single=true&output=csv`;

  let currentFormConfig = null;
  let adminPasswordToken = "";
  let adminPdfFiles = [];
  let adminImageFiles = [];

  // 初始化
  window.addEventListener('load', () => {
    initCanvas();
    loadFormConfigFromCSV();
  });

  // CSV 解析
  function parseCSV(text) {
    let lines = [];
    let row = [];
    let inQuotes = false;
    let currentStr = '';
    for (let i = 0; i < text.length; i++) {
      let c = text[i];
      let nextC = text[i+1];
      if (c === '"') {
        if (inQuotes && nextC === '"') {
          currentStr += '"';
          i++;
        } else {
          inQuotes = !inQuotes;
        }
      } else if (c === ',' && !inQuotes) {
        row.push(currentStr);
        currentStr = '';
      } else if ((c === '\r' || c === '\n') && !inQuotes) {
        if (c === '\r' && nextC === '\n') { i++; }
        row.push(currentStr);
        currentStr = '';
        if (row.length > 1 || row[0] !== '') {
          lines.push(row);
        }
        row = [];
      } else {
        currentStr += c;
      }
    }
    if (currentStr || row.length > 0) {
      row.push(currentStr);
      lines.push(row);
    }
    return lines;
  }

  function cleanJsonStr(str) {
    if (!str) return "[]";
    str = str.trim();
    if (str.startsWith("'")) str = str.substring(1);
    return str;
  }

  function loadFormConfigFromCSV() {
    fetch(CSV_URL)
      .then(res => {
        if (!res.ok) throw new Error("CSV Fetch Failed");
        return res.text();
      })
      .then(csvText => {
        const rows = parseCSV(csvText);
        if (rows.length >= 2) {
          const row = rows[1];

          let items = [];
          let extraFields = [];
          try { items = JSON.parse(cleanJsonStr(row[3])); } catch(e){}
          try { extraFields = JSON.parse(cleanJsonStr(row[11])); } catch(e){}

          let uLabel = row[9] || "學生姓名";
          if (uLabel.startsWith("[") || uLabel.startsWith("{")) uLabel = "學生姓名";

          let sLabel = row[10] || "家長簽名確認";
          if (sLabel.startsWith("[") || sLabel.startsWith("{")) sLabel = "家長簽名確認";

          currentFormConfig = {
            result: 'success',
            formId: row[0] || "CLASS_CONSENT_FORM",
            formTitle: row[1] || "班級同意書",
            formDesc: row[2] || "",
            items: items,
            formImgBase64: row[5] || "",
            formRefUrl: row[6] || "",
            minRequiredCount: parseInt(row[7] || "0", 10),
            gradeOptions: row[8] || "一年,二年,三年,四年,五年,六年",
            userNameLabel: uLabel,
            signatureLabel: sLabel,
            extraFields: extraFields
          };
          renderFormUI(currentFormConfig);
        } else {
          loadFormConfigFromGAS();
        }
      })
      .catch(err => {
        console.warn("CSV 讀取失敗，自動改用 GAS 備用路徑讀取：", err);
        loadFormConfigFromGAS();
      });
  }

  function handleImageUpload(fileInput, previewImgId, base64HiddenId) {
    const file = fileInput.files[0];
    if (!file) return;

    if (file.size > 1048576) {
      alert("⚠️ 照片附件檔案大小不能超過 1MB！");
      fileInput.value = "";
      return;
    }

    const reader = new FileReader();
    reader.onload = function(e) {
      const img = new Image();
      img.onload = function() {
        const canvas = document.createElement('canvas');
        const maxWidth = 500;
        let width = img.width, height = img.height;

        if (width > maxWidth) {
          height = Math.round((height * maxWidth) / width);
          width = maxWidth;
        }

        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);

        const compressedBase64 = canvas.toDataURL('image/jpeg', 0.6);

        document.getElementById(base64HiddenId).value = compressedBase64;
        const preview = document.getElementById(previewImgId);
        preview.src = compressedBase64;
        preview.style.display = 'block';

        const clearBtn = previewImgId === 'adminFormImgPreview' ? document.getElementById('clearHeaderImgBtn') : null;
        if (clearBtn) clearBtn.style.display = 'inline-block';
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function clearImageUpload(fileInputId, previewImgId, base64HiddenId) {
    document.getElementById(fileInputId).value = "";
    document.getElementById(base64HiddenId).value = "";
    const preview = document.getElementById(previewImgId);

    preview.style.display = 'none';

  // 簽名板
  const canvas = document.getElementById('signatureCanvas');
  const ctx = canvas.getContext('2d');
  let isDrawing = false, hasSigned = false, lastX = 0, lastY = 0;

  function initCanvas() {
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = '#000000';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
  }

  function getCanvasCoords(e) {
    const rect = canvas.getBoundingClientRect();
    let clientX = e.clientX, clientY = e.clientY;
    if (e.touches && e.touches.length > 0) {
      clientX = e.touches[0].clientX; clientY = e.touches[0].clientY;
    }
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
  }

  function startDrawing(e) {
    e.preventDefault(); isDrawing = true;
    const pos = getCanvasCoords(e); lastX = pos.x; lastY = pos.y;
    ctx.beginPath(); ctx.arc(lastX, lastY, 1.5, 0, Math.PI * 2); ctx.fill(); hasSigned = true;
  }
  function draw(e) {
    if (!isDrawing) return; e.preventDefault();
    const pos = getCanvasCoords(e);
    ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.lineTo(pos.x, pos.y); ctx.stroke();
    lastX = pos.x; lastY = pos.y; hasSigned = true;
  }
  function stopDrawing() { isDrawing = false; }

  canvas.addEventListener('mousedown', startDrawing); canvas.addEventListener('mousemove', draw); window.addEventListener('mouseup', stopDrawing);
  canvas.addEventListener('touchstart', startDrawing); canvas.addEventListener('touchmove', draw); canvas.addEventListener('touchend', stopDrawing);

  function clearSignature() {
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, canvas.width, canvas.height); hasSigned = false;
  }

  // 提交同意書
  document.getElementById('mainForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const checkboxes = document.querySelectorAll('.rule-check');
    const checkedBoxes = document.querySelectorAll('.rule-check:checked');

    let missingRequiredList = [];
    checkboxes.forEach((box) => {
      const idx = box.getAttribute('data-index');
      const itemObj = currentFormConfig.items[idx];
      if (itemObj.required && !box.checked) {
        missingRequiredList.push(`第 ${parseInt(idx) + 1} 題：${itemObj.title}`);
      }
    });

    if (missingRequiredList.length > 0) {
      return alert("⚠️ 以下條款為「必選項」，請確認勾選：\n\n• " + missingRequiredList.join("\n• "));
    }

    const minReqCount = parseInt(currentFormConfig.minRequiredCount || 0, 10);
    if (minReqCount > 0 && checkedBoxes.length < minReqCount) {
      return alert(`⚠️ 本同意書最少需勾選 ${minReqCount} 項！（您目前已勾選 ${checkedBoxes.length} 項）`);
    }

    const grade = document.getElementById('userGrade').value;
    const userClass = document.getElementById('userClass').value;
    const seat = document.getElementById('userSeat').value.trim();

    if (!grade || !userClass || !seat) {
      return alert("請完整選擇並填寫【年級、班級與座號】！");
    }

    const extraInputs = document.querySelectorAll('.user-extra-input');
    let extraFieldData = [];
    let missingExtraLabels = [];

    extraInputs.forEach(input => {
      const lbl = input.getAttribute('data-label');
      const isReq = input.getAttribute('data-required') === 'true';
      const val = input.value.trim();

      if (isReq && !val) {
        missingExtraLabels.push(lbl);
      }
      extraFieldData.push({ label: lbl, value: val });
    });

    if (missingExtraLabels.length > 0) {
      return alert("⚠️ 請填寫以下必填欄位：\n\n• " + missingExtraLabels.join("\n• "));
    }

    if (!hasSigned) {
      let sigLbl = currentFormConfig.signatureLabel || "親筆簽名確認";
      return alert(`請完成【${sigLbl}】！`);
    }

    const submitBtn = document.getElementById('submitBtn');
    const loadingOverlay = document.getElementById('loadingOverlay');
    submitBtn.disabled = true;
    loadingOverlay.style.display = 'block';

    let checkedItemsDetail = [];
    checkboxes.forEach((box) => {
      if (box.checked) {
        const idx = box.getAttribute('data-index');
        const itemObj = currentFormConfig.items[idx];
        checkedItemsDetail.push({
          title: itemObj.title,
          desc: itemObj.desc || "",
          refUrl: itemObj.refUrl || "",
          imgBase64: itemObj.imgBase64 || ""
        });
      }
    });

    const payload = {
      action: 'submitForm',
      formTitle: currentFormConfig.formTitle,
      formDesc: currentFormConfig.formDesc,
      formRefUrl: currentFormConfig.formRefUrl || "",
      formImgBase64: currentFormConfig.formImgBase64 || "",
      userNameLabel: currentFormConfig.userNameLabel || "學生姓名",
      signatureLabel: currentFormConfig.signatureLabel || "家長簽名確認",
      userName: document.getElementById('userName').value.trim(),
      classGroup: `${grade}${userClass}`,
      seatNo: seat,
      extraFieldData: extraFieldData,
      checkedCount: checkedBoxes.length,
      totalCount: checkboxes.length,
      checkedItemsDetail: checkedItemsDetail,
      signatureBase64: canvas.toDataURL('image/png')
    };

    fetch(GAS_WEB_APP_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(data => {
      if (data.result === 'success') {
        document.getElementById('mainForm').style.display = 'none';
        document.getElementById('successBox').style.display = 'block';
        document.getElementById('resFileId').innerText = data.fileId;
        document.getElementById('resDownloadBtn').href = data.downloadUrl;
      } else {
        alert("提交失敗：" + data.message);
        submitBtn.disabled = false;
        loadingOverlay.style.display = 'none';
      }
    });
  });

  function switchAdminTab(tabName) {
    const tabs = ['config', 'pdf', 'photo'];
    tabs.forEach(t => {
      const btn = document.querySelector(`.admin-tab-btn[onclick="switchAdminTab('${t}')"]`);
      const content = document.getElementById(`tab-${t}`);
      if (t === tabName) {
        if(btn) btn.classList.add('active');
        if(content) content.classList.add('active');
      } else {
        if(btn) btn.classList.remove('active');

      fetchAdminFileList();

    div.innerHTML = `
      <button type="button" class="del-item-btn" onclick="this.parentElement.remove()">🗑️ 刪除本項</button>
      <div style="margin-bottom:6px; display:flex; align-items:center; gap:10px;">
        <label><b>同意項目標題：</b></label>
        <input type="text" class="admin-item-title" value="${title}" placeholder="例如：同意參加戶外教學活動" style="flex:1; padding:4px;">
        <label style="color:#d93025; font-weight:bold; cursor:pointer;">
          <input type="checkbox" class="admin-item-required" ${required ? 'checked' : ''}> 必選項
        </label>
      </div>
      <div style="margin-bottom:6px;">
        <label><b>條款詳細說明：</b></label>
        <textarea class="admin-item-desc" style="width:100%; height:50px; padding:4px;" placeholder="請輸入說明與注意事項...">${desc}</textarea>
      </div>
      <div style="margin-bottom:6px;">
        <label><b>條款參考網址：</b></label>
        <input type="url" class="admin-item-refurl" value="${refUrl}" placeholder="例如：https://..." style="width:100%; padding:4px;">
      </div>
      <div>
        <label><b>條款照片附件 (限制 1MB 以內)：</b></label>
        <input type="file" accept="image/*" class="admin-item-img-file" onchange="handleItemImageUpload(this, '${rowId}')">
        <input type="hidden" class="admin-item-img-base64" value="${imgBase64}">
        <img class="img-preview admin-item-img-preview" src="${imgBase64}" style="${imgBase64 ? 'display:block;' : 'display:none;'}">
        <button type="button" class="clear-item-img-btn" onclick="clearItemImage('${rowId}')" style="${imgBase64 ? 'display:inline-block;' : 'display:none;'}">刪除照片</button>
      </div>
    `;
    container.appendChild(div);
  }

  function handleItemImageUpload(fileInput, rowId) {
    const row = document.getElementById(rowId);
    const preview = row.querySelector('.admin-item-img-preview');
    const hidden = row.querySelector('.admin-item-img-base64');
    const clearBtn = row.querySelector('.clear-item-img-btn');

    const file = fileInput.files[0];
    if (!file) return;

    if (file.size > 1048576) {
      alert("⚠️ 照片附件檔案大小不能超過 1MB！");
      fileInput.value = "";
      return;
    }

    const reader = new FileReader();
    reader.onload = function(e) {
      const img = new Image();
      img.onload = function() {
        const canvas = document.createElement('canvas');
        const maxWidth = 500;
        let width = img.width, height = img.height;
        if (width > maxWidth) {
          height = Math.round((height * maxWidth) / width);
          width = maxWidth;
        }
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        const compressedBase64 = canvas.toDataURL('image/jpeg', 0.6);

        hidden.value = compressedBase64;
        preview.src = compressedBase64;
        preview.style.display = 'block';
        clearBtn.style.display = 'inline-block';
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function clearItemImage(rowId) {
    const row = document.getElementById(rowId);
    row.querySelector('.admin-item-img-file').value = "";
    row.querySelector('.admin-item-img-base64').value = "";
    const preview = row.querySelector('.admin-item-img-preview');
    preview.src = "";
    preview.style.display = 'none';
    row.querySelector('.clear-item-img-btn').style.display = 'none';
  }

  function saveAdminFormConfig() {
    const saveBtn = document.getElementById('saveAdminFormBtn');
    const formTitle = document.getElementById('adminFormTitle').value.trim();
    const formDesc = document.getElementById('adminFormDesc').value.trim();
    const formRefUrl = document.getElementById('adminFormRefUrl').value.trim();
    const formImgBase64 = document.getElementById('adminFormImgBase64').value;
    
    let userNameLabel = document.getElementById('adminUserNameLabel').value.trim() || "學生姓名";
    let signatureLabel = document.getElementById('adminSignatureLabel').value.trim() || "家長簽名確認";

    const minRequiredCount = document.getElementById('adminMinRequiredCount').value || 0;
    const gradeOptions = document.getElementById('adminGradeOptions').value.trim() || "一年,二年,三年,四年,五年,六年";

    if (!formTitle) return alert("請填寫同意書主題！");

    const extraRows = document.querySelectorAll('.admin-extra-field-row');
    let extraFields = [];
    extraRows.forEach(row => {
      const lbl = row.querySelector('.admin-extra-label').value.trim();
      const isReq = row.querySelector('.admin-extra-required').checked;
      if (lbl) extraFields.push({ label: lbl, required: isReq });
    });

    const itemRows = document.querySelectorAll('.admin-item-row');
    let items = [];
    itemRows.forEach(row => {
      const t = row.querySelector('.admin-item-title').value.trim();
      const d = row.querySelector('.admin-item-desc').value.trim();
      const u = row.querySelector('.admin-item-refurl').value.trim();
      const img = row.querySelector('.admin-item-img-base64').value;
      const isReq = row.querySelector('.admin-item-required').checked;

      if (t) items.push({ title: t, desc: d, refUrl: u, imgBase64: img, required: isReq });
    });

    saveBtn.innerText = "⏳ 儲存中...";
    saveBtn.disabled = true;

    const payload = {
      action: 'saveFormConfig',
      password: adminPasswordToken,
      formTitle: formTitle,
      formDesc: formDesc,
      formRefUrl: formRefUrl,
      formImgBase64: formImgBase64,
      userNameLabel: userNameLabel,
      signatureLabel: signatureLabel,
      extraFields: extraFields,
      minRequiredCount: minRequiredCount,
      gradeOptions: gradeOptions,
      items: items
    };

    fetch(GAS_WEB_APP_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(data => {
      saveBtn.innerText = "💾 儲存同意書設定";
      saveBtn.disabled = false;

      if (data.result === 'success') {
        alert("✅ " + data.message);
        setTimeout(() => { loadFormConfigFromCSV(); }, 800);
      } else {
        alert("儲存失敗：" + data.message);
      }
    })
    .catch(err => {
      saveBtn.innerText = "💾 儲存同意書設定";
      saveBtn.disabled = false;
      alert("儲存失敗：請求發生錯誤 (" + err.toString() + ")");
    });
  }
</script>

</body>
</html>
