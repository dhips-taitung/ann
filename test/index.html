<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>班級同意書動態檢核系統</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background-color: #f4f6f9;
      margin: 0;
      padding: 15px 10px;
      color: #333;
    }
    .container {
      max-width: 820px;
      margin: 0 auto;
      background: #ffffff;
      padding: 25px 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .query-card {
      background-color: #eef3fc;
      border: 1px solid #c2d7fa;
      border-radius: 8px;
      padding: 12px 18px;
      margin-bottom: 20px;
    }
    .query-input-group {
      display: flex;
      gap: 10px;
      margin-top: 6px;
    }
    .query-input-group input {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .query-btn {
      padding: 8px 16px;
      background-color: #1a73e8;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    h2 { text-align: center; color: #1a73e8; margin-top: 0; }
    .header-desc {
      font-size: 14px;
      color: #5f6368;
      line-height: 1.6;
      background-color: #f8f9fa;
      border: 1px solid #e8eaed;
      padding: 12px 15px;
      border-radius: 6px;
      margin-bottom: 15px;
      white-space: pre-wrap;
    }

    .ref-link-box {
      background: #f0f7ff;
      border: 1px solid #c2d7fa;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13.5px;
      margin-bottom: 15px;
      word-break: break-all;
    }
    .ref-link-box a { color: #1a73e8; font-weight: bold; text-decoration: underline; }

    .header-img-display {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      margin-bottom: 15px;
      display: block;
    }

    .section-card {
      background: #fafafa;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 18px 20px;
      margin-bottom: 20px;
    }
    .checkbox-item {
      display: flex;
      align-items: flex-start;
      margin-bottom: 10px;
      font-size: 15px;
      line-height: 1.5;
      cursor: pointer;
    }
    .checkbox-item input[type="checkbox"] {
      width: 20px;
      height: 20px;
      margin-right: 12px;
      margin-top: 2px;
      flex-shrink: 0;
    }
    .item-desc-box {
      background-color: #f0f7ff;
      border-left: 4px solid #1a73e8;
      padding: 8px 12px;
      font-size: 13px;
      color: #333;
      margin-top: 4px;
      margin-bottom: 10px;
      margin-left: 32px;
      border-radius: 0 4px 4px 0;
      line-height: 1.5;
      white-space: pre-wrap;
    }
    .item-img-display {
      max-width: 280px;
      max-height: 200px;
      border-radius: 6px;
      margin-top: 6px;
      margin-bottom: 10px;
      margin-left: 32px;
      display: block;
      border: 1px solid #ddd;
    }

    .input-group { margin-bottom: 15px; }
    .input-group label { display: block; font-weight: bold; margin-bottom: 5px; }
    .input-group input, .input-group select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }

    .class-info-group {
      display: flex;
      gap: 12px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }
    .class-info-item {
      flex: 1;
      min-width: 100px;
    }
    .class-info-item label { display: block; font-weight: bold; margin-bottom: 5px; }
    .class-info-item select, .class-info-item input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }

    .signature-container {
      border: 2px dashed #1a73e8;
      border-radius: 8px;
      background-color: #ffffff;
      margin-top: 8px;
    }
    canvas#signatureCanvas {
      width: 100%;
      height: 216px;
      display: block;
      cursor: crosshair;
    }
    .clear-btn {
      float: right;
      margin-top: 6px;
      background: #e0e0e0;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      background-color: #34a853;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
    }
    .submit-btn:hover { background-color: #2d8e47; }
    .submit-btn:disabled { background-color: #cccccc; cursor: not-allowed; }

    .modal-overlay {
      display: none;
      position: fixed;
      top:0; left:0; right:0; bottom:0;
      background: rgba(0,0,0,0.6);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 10px;
    }
    .modal-card {
      background: white;
      border-radius: 10px;
      padding: 25px;
      width: 100%;
      max-width: 800px;
      max-height: 90vh;
      overflow-y: auto;
    }
    
    /* 後台 Tab 樣式 */
    .admin-tab-bar {
      display: flex;
      border-bottom: 2px solid #e0e0e0;
      margin-bottom: 15px;
      gap: 5px;
    }
    .admin-tab-btn {
      padding: 10px 18px;
      background: #f1f3f4;
      border: none;
      border-radius: 6px 6px 0 0;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      color: #555;
    }
    .admin-tab-btn.active {
      background: #1a73e8;
      color: white;
    }
    .admin-tab-content { display: none; }

    .admin-item-row, .admin-extra-field-row {
      background: #f8f9fa;
      border: 1px solid #ddd;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 12px;
      position: relative;
    }
    .del-item-btn {
      float: right;
      background: #d93025;
      color: white;
      border: none;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
    }
    .img-preview {
      max-width: 150px;
      max-height: 100px;
      border-radius: 4px;
      margin-top: 6px;
      display: none;
      border: 1px solid #ccc;
    }

    .required-badge {
      color: #d93025;
      font-size: 12px;
      border: 1px solid #d93025;
      border-radius: 3px;
      padding: 1px 5px;
      margin-left: 6px;
      font-weight: bold;
    }

    #loadingOverlay { display: none; text-align: center; margin-top: 15px; color: #1a73e8; font-weight: bold; }
    #successBox { display: none; text-align: center; padding: 20px; }
    .file-id-box {
      background: #e8f0fe;
      padding: 10px;
      font-size: 24px;
      font-weight: bold;
      color: #1a73e8;
      border-radius: 6px;
      margin: 10px 0;
    }
    .download-btn {
      display: inline-block;
      margin-top: 10px;
      padding: 12px 24px;
      background: #d93025;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
    }

    /* 頁尾後台登入連結 */
    .footer-admin-link {
      text-align: center;
      margin-top: 30px;
      padding-top: 15px;
      border-top: 1px dashed #e0e0e0;
      font-size: 13px;
    }
    .footer-admin-link a {
      color: #70757a;
      text-decoration: none;
      font-weight: bold;
    }
    .footer-admin-link a:hover {
      color: #1a73e8;
      text-decoration: underline;
    }

    /* 資料表格 */
    .data-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 13px;
    }
    .data-table th, .data-table td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: left;
    }
    .data-table th {
      background-color: #f1f3f4;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- 重複下載查詢區塊 -->
  <div class="query-card">
    <div style="font-weight: bold; color: #1a73e8;">🔍 查詢已填寫表單 (下載 PDF)</div>
    <div class="query-input-group">
      <input type="text" id="queryFileId" placeholder="請輸入 6 位數檔案 ID (例如：849201)">
      <button type="button" class="query-btn" onclick="queryPDF()">查詢</button>
    </div>
    <div id="queryResult"></div>
  </div>

  <!-- 前台填表畫面 -->
  <form id="mainForm">
    <h2 id="displayTitle">載入中...</h2>
    <div class="header-desc" id="displayDesc">正在讀取表單設定內容...</div>
    
    <!-- 標題參考網址與照片展示區 -->
    <div id="displayRefUrl" class="ref-link-box" style="display:none;"></div>
    <img id="displayImg" class="header-img-display" style="display:none;">

    <!-- 個人基本資料 -->
    <div class="input-group">
      <label><span id="displayUserNameLabel">填寫人姓名</span> <span style="color:red">*</span></label>
      <input type="text" id="userName" placeholder="請輸入姓名" required>
    </div>

    <!-- 班級使用版：年級、班級、座號欄位 -->
    <div class="class-info-group">
      <div class="class-info-item">
        <label>年級 <span style="color:red">*</span></label>
        <select id="userGrade" required>
          <option value="">請選擇年級</option>
        </select>
      </div>

      <div class="class-info-item">
        <label>班級 <span style="color:red">*</span></label>
        <select id="userClass" required>
          <option value="">請選擇班級</option>
          <option value="一班">一班</option>
          <option value="二班">二班</option>
          <option value="三班">三班</option>
          <option value="四班">四班</option>
        </select>
      </div>

      <div class="class-info-item">
        <label>座號 <span style="color:red">*</span></label>
        <input type="number" id="userSeat" min="1" max="99" placeholder="例如: 1" required>
      </div>
    </div>

    <!-- 動態渲染自訂延伸基本資料欄位 -->
    <div id="extraFieldsContainer"></div>

    <!-- 動態檢核題目渲染區 -->
    <div id="checklistContainer"></div>

    <!-- 手寫簽名 (高度 216px) -->
    <div class="input-group">
      <label><span id="displaySignatureLabel">親筆簽名確認</span> <span style="color:red">*</span></label>
      <div class="signature-container">
        <canvas id="signatureCanvas" width="700" height="216"></canvas>
      </div>
      <button type="button" class="clear-btn" onclick="clearSignature()">清除重簽</button>
      <div style="clear: both;"></div>
    </div>

    <button type="submit" class="submit-btn" id="submitBtn">確認送出表單並生成 PDF</button>
    <div id="loadingOverlay">資料處理中，請稍候...</div>
  </form>

  <!-- 送出成功結果 -->
  <div id="successBox">
    <h3 style="color:#34a853;">🎉 表單與簽名已成功提交！</h3>
    <p>請保存您的專屬 6 位數檔案 ID：</p>
    <div class="file-id-box" id="resFileId">000000</div>
    <a href="#" target="_blank" class="download-btn" id="resDownloadBtn">📄 立即下載 PDF 檔</a>
    <br><br>
    <button type="button" onclick="location.reload()" style="padding:8px 16px; cursor:pointer;">填寫新表單</button>
  </div>

  <!-- 頁尾後台開啟連結 -->
  <div class="footer-admin-link">
    <a href="#" onclick="openAdminLogin(); return false;">🔐 管理者後台登入</a>
  </div>
</div>

<!-- 管理者登入 Modal -->
<div class="modal-overlay" id="loginModal">
  <div class="modal-card" style="max-width: 400px;">
    <h3>🔐 管理者登入</h3>
    <div class="input-group">
      <label>請輸入管理者密碼：</label>
      <input type="password" id="adminPasswordInput" placeholder="請輸入密碼">
    </div>
    <button class="query-btn" style="width:100%;" onclick="submitAdminLogin()">登入後台</button>
    <button style="width:100%; margin-top:8px; padding:8px;" onclick="closeModal('loginModal')">取消</button>
  </div>
</div>

<!-- 管理者後台設定 Modal -->
<div class="modal-overlay" id="adminModal">
  <div class="modal-card">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h3 style="margin:0;">⚙️ 管理者系統後台</h3>
      <button type="button" onclick="closeModal('adminModal')" style="padding:4px 10px; cursor:pointer;">✕ 關閉後台</button>
    </div>
    <hr style="margin:15px 0;">

    <!-- 後台 Tab 標籤列 -->
    <div class="admin-tab-bar">
      <button class="admin-tab-btn active" onclick="switchAdminTab('formTab', this)">⚙️ 表單與題目設定</button>
      <button class="admin-tab-btn" onclick="switchAdminTab('pdfTab', this)">📄 PDF 檔與提交紀錄</button>
      <button class="admin-tab-btn" onclick="switchAdminTab('attachTab', this)">🖼️ 附件圖片管理</button>
    </div>

    <!-- Tab 1: 表單設定頁面 -->
    <div id="formTab" class="admin-tab-content" style="display:block;">
      <div class="input-group">
        <label>選擇要編輯的表單：</label>
        <select id="adminFormSelect" onchange="loadFormToAdmin()"></select>
        <button type="button" onclick="createNewFormInAdmin()" style="margin-top:5px; padding:6px 12px; cursor:pointer;">➕ 新增全新表單</button>
      </div>

      <div class="input-group">
        <label>表單編號 (ID)：</label>
        <input type="text" id="adminFormId" readonly placeholder="系統自動生成">
      </div>

      <div class="input-group">
        <label>檢核主題 (標題)：</label>
        <input type="text" id="adminFormTitle" placeholder="請輸入表單主題">
      </div>

      <div class="input-group">
        <label>標題說明欄位 (表單說明)：</label>
        <textarea id="adminFormDesc" style="width:100%; height:80px; border-radius:6px; padding:8px;" placeholder="請輸入說明條文內容..."></textarea>
      </div>

      <div style="display:flex; gap:10px;">
        <div class="input-group" style="flex:1;">
          <label>「填寫人姓名」欄位名稱：</label>
          <input type="text" id="adminUserNameLabel" placeholder="預設：填寫人姓名">
        </div>
        <div class="input-group" style="flex:1;">
          <label>「親筆簽名」欄位名稱：</label>
          <input type="text" id="adminSignatureLabel" placeholder="預設：親筆簽名確認">
        </div>
      </div>

      <div style="background:#f1f5f9; padding:12px; border-radius:6px; border:1px solid #cbd5e1; margin-bottom:15px;">
        <h5 style="margin:0 0 8px 0; color:#1e293b;">自訂延伸基本資料欄位 (如：家長電話、聯絡地址等)</h5>
        <div id="adminExtraFieldsContainer"></div>
        <button type="button" onclick="addAdminExtraFieldRow()" style="padding:5px 10px; background:#475569; color:white; border:none; border-radius:4px; cursor:pointer;">➕ 新增基本資料欄位</button>
      </div>

      <div class="input-group" style="background:#f8f9fa; padding:10px; border-radius:6px; border:1px solid #ddd;">
        <label style="color:#1a73e8;">自訂年級下拉選單 (以逗號分隔)：</label>
        <input type="text" id="adminGradeOptions" placeholder="例如：一年,二年,三年">
      </div>

      <div class="input-group" style="background:#eef3fc; padding:10px; border-radius:6px; border:1px solid #c2d7fa;">
        <label style="color:#1a73e8;">全表單最少需勾選數量：</label>
        <input type="number" id="adminMinRequiredCount" min="0" value="0" placeholder="0">
      </div>

      <div class="input-group">
        <label>檢核主題參考網址 (選擇性)：</label>
        <input type="url" id="adminFormRefUrl" placeholder="https://...">
      </div>

      <div class="input-group">
        <label>檢核主題照片附件 (限制 1MB 以內)：</label>
        <input type="file" id="adminFormImgFile" accept="image/*" onchange="handleImageUpload(this, 'adminFormImgPreview', 'adminFormImgBase64')">
        <input type="hidden" id="adminFormImgBase64">
        <img id="adminFormImgPreview" class="img-preview">
        <button type="button" onclick="clearImageUpload('adminFormImgFile', 'adminFormImgPreview', 'adminFormImgBase64')" style="display:none;" id="clearHeaderImgBtn">清除照片</button>
      </div>

      <hr style="margin:20px 0;">

      <h4>檢核項目設定 (可自由增刪)</h4>
      <div id="adminItemsContainer"></div>
      <button type="button" onclick="addAdminItemRow()" style="padding:8px 14px; background:#1a73e8; color:white; border:none; border-radius:4px; cursor:pointer; font-weight:bold;">➕ 新增檢核項目</button>

      <br><br>
      <div id="adminFormUrlBox" style="background:#e8f0fe; padding:10px; border-radius:6px; font-size:13px; display:none; word-break:break-all;"></div>
      <br>

      <button type="button" class="submit-btn" id="saveAdminFormBtn" onclick="saveAdminFormConfig()">💾 儲存表單內容</button>
    </div>

    <!-- Tab 2: PDF 紀錄頁面 (懶載入) -->
    <div id="pdfTab" class="admin-tab-content">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h4 style="margin:0;">📄 PDF 檔與提交紀錄清單</h4>
        <button type="button" onclick="fetchPDFList()" style="padding:6px 12px; cursor:pointer;">🔄 重新整理</button>
      </div>
      <div id="pdfListContainer" style="margin-top:10px;">點擊此分頁載入資料...</div>
    </div>

    <!-- Tab 3: 附件圖檔頁面 (懶載入) -->
    <div id="attachTab" class="admin-tab-content">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h4 style="margin:0;">🖼️ 圖檔與附件檔案清單</h4>
        <button type="button" onclick="fetchAttachmentList()" style="padding:6px 12px; cursor:pointer;">🔄 重新整理</button>
      </div>
      <div id="attachmentListContainer" style="margin-top:10px;">點擊此分頁載入資料...</div>
    </div>

    <br>
    <button type="button" style="width:100%; padding:10px; background:#6c757d; color:white; border:none; border-radius:6px; font-weight:bold; cursor:pointer;" onclick="closeModal('adminModal')">關閉後台</button>
  </div>
</div>

<script>
  const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxXpi0zSLgzr1ix2UM_wp3kED24uF80E2odz8a2MQepKE0JmUbmUPPwB9jN3aSwemOF/exec";

  let currentFormId = "";
  let currentFormConfig = null;
  let adminPasswordToken = "";
  
  let isPdfLoaded = false;
  let isAttachLoaded = false;

  // 網頁載入初始化
  window.addEventListener('load', () => {
    initCanvas();
    const urlParams = new URLSearchParams(window.location.search);
    const formIdFromUrl = urlParams.get('formId');
    fetchFormList(formIdFromUrl);
  });

  // 切換後台分頁 (Tab)
  function switchAdminTab(tabId, btn) {
    document.querySelectorAll('.admin-tab-content').forEach(el => el.style.display = 'none');
    document.querySelectorAll('.admin-tab-btn').forEach(el => el.classList.remove('active'));

    document.getElementById(tabId).style.display = 'block';
    if (btn) btn.classList.add('active');

    // 切換時才懶載入資料
    if (tabId === 'pdfTab' && !isPdfLoaded) {
      fetchPDFList();
    } else if (tabId === 'attachTab' && !isAttachLoaded) {
      fetchAttachmentList();
    }
  }

  // 懶載入抓取 PDF 紀錄
  function fetchPDFList() {
    const container = document.getElementById('pdfListContainer');
    container.innerHTML = "⏳ 正在讀取 PDF 紀錄...";
    const targetFormId = document.getElementById('adminFormSelect').value || currentFormId;

    fetch(GAS_WEB_APP_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'getPDFList', formId: targetFormId })
    })
    .then(res => res.json())
    .then(data => {
      if (data.result === 'success') {
        isPdfLoaded = true;
        if (data.list.length === 0) {
          container.innerHTML = "目前無任何提交紀錄。";
          return;
        }
        let html = `<table class="data-table"><thead><tr><th>時間</th><th>ID</th><th>姓名</th><th>班級座號</th><th>勾選進度</th><th>PDF下載</th></tr></thead><tbody>`;
        data.list.forEach(item => {
          html += `<tr>
            <td>${item.time}</td>
            <td><b>${item.easyId}</b></td>
            <td>${item.userName}</td>
            <td>${item.classGroup} ${item.seatNo}號</td>
            <td>${item.progress}</td>
            <td><a href="${item.downloadUrl}" target="_blank" style="color:#1a73e8; font-weight:bold;">下載 PDF</a></td>
          </tr>`;
        });
        html += `</tbody></table>`;
        container.innerHTML = html;
      } else {
        container.innerHTML = "讀取失敗：" + data.message;
      }
    });
  }

  // 懶載入抓取圖片附件
  function fetchAttachmentList() {
    const container = document.getElementById('attachmentListContainer');
    container.innerHTML = "⏳ 正在讀取照片附件清單...";

    fetch(GAS_WEB_APP_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },

  // 圖片上傳壓縮與處理
  function handleImageUpload(fileInput, previewImgId, base64HiddenId) {
    const file = fileInput.files[0];
    if (!file) return;

    if (file.size > 1048576) {
      alert("⚠️ 照片附件檔案大小不能超過 1MB！");
      fileInput.value = "";
      return;
    }

    const reader = new FileReader();
    reader.onload = function(e) {
      const img = new Image();
      img.onload = function() {
        const canvas = document.createElement('canvas');
        const maxWidth = 500;
        let width = img.width, height = img.height;
        if (width > maxWidth) {
          height = Math.round((height * maxWidth) / width);
          width = maxWidth;
        }
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);

        const compressedBase64 = canvas.toDataURL('image/jpeg', 0.6);
        document.getElementById(base64HiddenId).value = compressedBase64;
        const preview = document.getElementById(previewImgId);
        preview.src = compressedBase64;
        preview.style.display = 'block';

        const clearBtn = previewImgId === 'adminFormImgPreview' ? document.getElementById('clearHeaderImgBtn') : null;
        if (clearBtn) clearBtn.style.display = 'inline-block';
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  // 手寫簽名繪圖引擎
  const canvas = document.getElementById('signatureCanvas');
  const ctx = canvas.getContext('2d');
  let isDrawing = false, hasSigned = false, lastX = 0, lastY = 0;

  function initCanvas() {
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = '#000000';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
  }

  function getCanvasCoords(e) {
    const rect = canvas.getBoundingClientRect();
    let clientX = e.clientX, clientY = e.clientY;
    if (e.touches && e.touches.length > 0) {
      clientX = e.touches[0].clientX; clientY = e.touches[0].clientY;
    }
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
  }

  function startDrawing(e) {
    e.preventDefault(); isDrawing = true;
    const pos = getCanvasCoords(e); lastX = pos.x; lastY = pos.y;
    ctx.beginPath(); ctx.arc(lastX, lastY, 1.5, 0, Math.PI * 2); ctx.fill(); hasSigned = true;
  }
  function draw(e) {
    if (!isDrawing) return; e.preventDefault();
    const pos = getCanvasCoords(e);
    ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.lineTo(pos.x, pos.y); ctx.stroke();
    lastX = pos.x; lastY = pos.y; hasSigned = true;
  }
  function stopDrawing() { isDrawing = false; }

  canvas.addEventListener('mousedown', startDrawing); canvas.addEventListener('mousemove', draw); window.addEventListener('mouseup', stopDrawing);
  canvas.addEventListener('touchstart', startDrawing); canvas.addEventListener('touchmove', draw); canvas.addEventListener('touchend', stopDrawing);

  function clearSignature() {
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, canvas.width, canvas.height); hasSigned = false;
  }

  // 提交填表
  document.getElementById('mainForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const checkboxes = document.querySelectorAll('.rule-check');
    const checkedBoxes = document.querySelectorAll('.rule-check:checked');

    let missingRequiredList = [];
    checkboxes.forEach((box) => {
      const idx = box.getAttribute('data-index');
      const itemObj = currentFormConfig.items[idx];
      if (itemObj.required && !box.checked) {
        missingRequiredList.push(`第 ${parseInt(idx) + 1} 題：${itemObj.title}`);
      }
    });

    if (missingRequiredList.length > 0) {
      return alert("⚠️ 以下為「必選項」，請確認勾選：\n\n• " + missingRequiredList.join("\n• "));
    }

    const minReqCount = parseInt(currentFormConfig.minRequiredCount || 0, 10);
    if (minReqCount > 0 && checkedBoxes.length < minReqCount) {
      return alert(`⚠️ 本表單設定最少需勾選 ${minReqCount} 項！（目前已勾選 ${checkedBoxes.length} 項）`);
    }

    const grade = document.getElementById('userGrade').value;
    const userClass = document.getElementById('userClass').value;
    const seat = document.getElementById('userSeat').value.trim();

    if (!grade || !userClass || !seat) {
      return alert("請完整選擇並填寫【年級、班級與座號】！");
    }

    const extraInputs = document.querySelectorAll('.user-extra-input');
    let extraFieldData = [];
    let missingExtraLabels = [];

    extraInputs.forEach(input => {
      const lbl = input.getAttribute('data-label');
      const isReq = input.getAttribute('data-required') === 'true';
      const val = input.value.trim();
      if (isReq && !val) missingExtraLabels.push(lbl);
      extraFieldData.push({ label: lbl, value: val });
    });

    if (missingExtraLabels.length > 0) {
      return alert("⚠️ 請填寫以下必填欄位：\n\n• " + missingExtraLabels.join("\n• "));
    }

    if (!hasSigned) {
      let sigLbl = currentFormConfig.signatureLabel || "親筆簽名確認";
      if (sigLbl.startsWith("[") || sigLbl.startsWith("{")) sigLbl = "親筆簽名確認";
      return alert(`請完成【${sigLbl}】！`);
    }

    const submitBtn = document.getElementById('submitBtn');
    const loadingOverlay = document.getElementById('loadingOverlay');
    submitBtn.disabled = true;
    loadingOverlay.style.display = 'block';

    let checkedItemsDetail = [];
    checkboxes.forEach((box) => {
      if (box.checked) {
        const idx = box.getAttribute('data-index');
        const itemObj = currentFormConfig.items[idx];
        checkedItemsDetail.push({
          title: itemObj.title,
          desc: itemObj.desc || "",
          refUrl: itemObj.refUrl || "",
          imgBase64: itemObj.imgBase64 || ""
        });
      }
    });

    let userNameLbl = currentFormConfig.userNameLabel || "填寫人姓名";
    if (userNameLbl.startsWith("[") || userNameLbl.startsWith("{")) userNameLbl = "填寫人姓名";

    let signatureLbl = currentFormConfig.signatureLabel || "親筆簽名確認";
    if (signatureLbl.startsWith("[") || signatureLbl.startsWith("{")) signatureLbl = "親筆簽名確認";

    const payload = {
      action: 'submitForm',
      formId: currentFormId,
      formTitle: currentFormConfig.formTitle,
      formDesc: currentFormConfig.formDesc,
      formRefUrl: currentFormConfig.formRefUrl || "",
      formImgBase64: currentFormConfig.formImgBase64 || "",
      userNameLabel: userNameLbl,
      signatureLabel: signatureLbl,
      userName: document.getElementById('userName').value.trim(),
      classGroup: `${grade}${userClass}`,
      seatNo: seat,
      extraFieldData: extraFieldData,
      checkedCount: checkedBoxes.length,
      totalCount: checkboxes.length,
      checkedItemsDetail: checkedItemsDetail,
      signatureBase64: canvas.toDataURL('image/png')
    };

    fetch(GAS_WEB_APP_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(data => {
      if (data.result === 'success') {
        document.getElementById('mainForm').style.display = 'none';
        document.getElementById('successBox').style.display = 'block';
        document.getElementById('resFileId').innerText = data.fileId;
        document.getElementById('resDownloadBtn').href = data.downloadUrl;
      } else {
        alert("提交失敗：" + data.message);
        submitBtn.disabled = false;
        loadingOverlay.style.display = 'none';
      }
    });
  });

  function handleItemImageUpload(fileInput, rowId) {
    const row = document.getElementById(rowId);
    const preview = row.querySelector('.admin-item-img-preview');
    const hidden = row.querySelector('.admin-item-img-base64');
    const clearBtn = row.querySelector('.clear-item-img-btn');

    const file = fileInput.files[0];
    if (!file) return;

    if (file.size > 1048576) {
      alert("⚠️ 照片附件檔案大小不能超過 1MB！");
      fileInput.value = "";
      return;
    }

    const reader = new FileReader();
    reader.onload = function(e) {
      const img = new Image();
      img.onload = function() {
        const canvas = document.createElement('canvas');
        const maxWidth = 500;
        let width = img.width, height = img.height;
        if (width > maxWidth) {
          height = Math.round((height * maxWidth) / width);
          width = maxWidth;
        }
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        const compressedBase64 = canvas.toDataURL('image/jpeg', 0.6);

        hidden.value = compressedBase64;
        preview.src = compressedBase64;
        preview.style.display = 'block';
        clearBtn.style.display = 'inline-block';
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

    row.querySelector('.admin-item-img-file').value = "";
    row.querySelector('.admin-item-img-base64').value = "";
    const preview = row.querySelector('.admin-item-img-preview');
    preview.src = ""; preview.style.display = 'none';
    row.querySelector('.clear-item-img-btn').style.display = 'none';
  }

  // 儲存表單設定 (儲存完成後保持後台開啟，不自動關閉)
  function saveAdminFormConfig() {
    const saveBtn = document.getElementById('saveAdminFormBtn');
    const formId = document.getElementById('adminFormId').value;
    const formTitle = document.getElementById('adminFormTitle').value.trim();
    const formDesc = document.getElementById('adminFormDesc').value.trim();
    const formRefUrl = document.getElementById('adminFormRefUrl').value.trim();
    const formImgBase64 = document.getElementById('adminFormImgBase64').value;
    
    let userNameLabel = document.getElementById('adminUserNameLabel').value.trim() || "填寫人姓名";
    if (userNameLabel.startsWith("[") || userNameLabel.startsWith("{")) userNameLabel = "填寫人姓名";

    let signatureLabel = document.getElementById('adminSignatureLabel').value.trim() || "親筆簽名確認";
    if (signatureLabel.startsWith("[") || signatureLabel.startsWith("{")) signatureLabel = "親筆簽名確認";

    const minRequiredCount = document.getElementById('adminMinRequiredCount').value || 0;
    const gradeOptions = document.getElementById('adminGradeOptions').value.trim() || "一年,二年,三年,四年,五年,六年";

    if (!formTitle) return alert("請填寫表單主題！");

    const extraRows = document.querySelectorAll('.admin-extra-field-row');
    let extraFields = [];
    extraRows.forEach(row => {
      const lbl = row.querySelector('.admin-extra-label').value.trim();
      const isReq = row.querySelector('.admin-extra-required').checked;
      if (lbl) extraFields.push({ label: lbl, required: isReq });
    });

    const itemRows = document.querySelectorAll('.admin-item-row');
    let items = [];
    itemRows.forEach(row => {
      const t = row.querySelector('.admin-item-title').value.trim();
      const d = row.querySelector('.admin-item-desc').value.trim();
      const u = row.querySelector('.admin-item-refurl').value.trim();
      const img = row.querySelector('.admin-item-img-base64').value;
      const isReq = row.querySelector('.admin-item-required').checked;
      if (t) items.push({ title: t, desc: d, refUrl: u, imgBase64: img, required: isReq });
    });

    saveBtn.innerText = "⏳ 儲存中...";
    saveBtn.disabled = true;

    const payload = {
      action: 'saveFormConfig',
      password: adminPasswordToken,
      formId: formId,
      formTitle: formTitle,
      formDesc: formDesc,
      formRefUrl: formRefUrl,
      formImgBase64: formImgBase64,
      userNameLabel: userNameLabel,
      signatureLabel: signatureLabel,
      extraFields: extraFields,
      minRequiredCount: minRequiredCount,
      gradeOptions: gradeOptions,
      items: items
    };

    fetch(GAS_WEB_APP_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(data => {
      saveBtn.innerText = "💾 儲存表單內容";
      saveBtn.disabled = false;

      if (data.result === 'success') {
        alert(data.message);
        document.getElementById('adminFormId').value = data.formId;
        fetchFormList(data.formId);
        // 優化 4：完成儲存後不要關閉後台 modal，僅能由使用者手動點選「關閉後台」
      } else {
        alert("儲存失敗：" + data.message);
      }
    })
    .catch(err => {
      saveBtn.innerText = "💾 儲存表單內容";
      saveBtn.disabled = false;
      alert("儲存失敗：" + err.toString());
    });
  }
</script>
